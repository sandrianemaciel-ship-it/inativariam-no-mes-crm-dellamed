// in whenever that ofensor is chosen, per the retention playbook.
function ofensorDetailFieldsHtml(ofensorValue, detail, prefix){
  detail = detail || {};
  const kind = OFENSOR_DETAIL_KIND[ofensorValue];
  if(!kind) return "";
  if(kind==="preco"){
    return `
      <div class="section-title">Detalhe do ofensor — ${escapeHtml(ofensorValue)}</div>
      <div class="grid2">
        <div class="field" style="grid-column:1/-1;"><label>Em qual item perdemos em preço?</label>
          <input class="form-input" id="${prefix}_itemPerdido" value="${escapeHtml(detail.itemPerdido||"")}" placeholder="Ex: linha Ortho, kit tal...">
        </div>
        <div class="field"><label>Preço oferecido pela concorrência (R$)</label>
          <input class="form-input" type="number" step="0.01" id="${prefix}_precoConcorrencia" value="${detail.precoConcorrencia||""}">
        </div>
        <div class="field"><label>Comprovação (print/áudio do cliente ou orçamento da concorrência) *</label>
          <input class="form-input" type="file" accept="image/*,.pdf" id="${prefix}_comprovacao">
          <div style="font-size:10.5px; color:var(--ink-faint); margin-top:3px;">${detail.comprovacaoId ? "Já existe um anexo salvo — escolha outro arquivo só se quiser substituí-lo." : "Obrigatório. Máx. ~150 KB (foto/print)."}</div>
        </div>
      </div>`;
  }
  if(kind==="giro"){
    return `
      <div class="section-title">Detalhe do ofensor — Giro</div>
      <div class="field"><label>Quais linhas o cliente compra? *</label>
        <div class="stage-row">${LINHAS_OPTIONS.map(o=>`<label class="stage-pill" style="cursor:pointer;"><input type="checkbox" class="visually-hidden ${prefix}_linhasCompradas" value="${o}" ${((detail.linhasCompradas||[]).includes(o))?"checked":""}> ${o}</label>`).join("")}</div>
      </div>`;
  }
  if(kind==="estoque"){
    return `
      <div class="section-title">Detalhe do ofensor — Estoque</div>
      <div class="grid2">
        <div class="field"><label>Item que fez perder o pedido</label>
          <input class="form-input" id="${prefix}_itemFaltante" value="${escapeHtml(detail.itemFaltante||"")}">
        </div>
        <div class="field"><label>Quantidade que o cliente compraria</label>
          <input class="form-input" type="number" id="${prefix}_quantidadeDesejada" value="${detail.quantidadeDesejada||""}">
        </div>
      </div>`;
  }
  if(kind==="meios"){
    return `
      <div class="section-title">Detalhe do ofensor — ${escapeHtml(ofensorValue)}</div>
      <div class="field"><label>Quais meios de contato foram tentados? *</label>
        <div class="stage-row">${MEIOS_CONTATO_OPTIONS.map(o=>`<label class="stage-pill" style="cursor:pointer;"><input type="checkbox" class="visually-hidden ${prefix}_meiosTentados" value="${o}" ${((detail.meiosTentados||[]).includes(o))?"checked":""}> ${o}</label>`).join("")}</div>
      </div>`;
  }
  return "";
}
function wireOfensorPills(root, prefix){
  root.querySelectorAll(`.${prefix}_linhasCompradas, .${prefix}_meiosTentados`).forEach(cb=>{
    cb.addEventListener("change", ()=>{ cb.closest(".stage-pill").classList.toggle("on", cb.checked); });
    if(cb.checked) cb.closest(".stage-pill").classList.add("on");
  });
}
async function collectOfensorDetail(root, ofensorValue, prevDetail, prefix){
  const kind = OFENSOR_DETAIL_KIND[ofensorValue];
  if(!kind) return {ok:true, detail:null};
  const detail = {tipo:ofensorValue};
  if(kind==="preco"){
    detail.itemPerdido = (root.querySelector(`#${prefix}_itemPerdido`)||{}).value || "";
    detail.precoConcorrencia = Number((root.querySelector(`#${prefix}_precoConcorrencia`)||{}).value || 0) || null;
    const fileInput = root.querySelector(`#${prefix}_comprovacao`);
    detail.comprovacaoId = (prevDetail&&prevDetail.comprovacaoId) || null;
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      if(file.size > 200*1024){
        return {ok:false, msg:"O arquivo de comprovação precisa ter até ~150-200 KB. Envie um print/foto mais leve."};
      }
      const dataUrl = await new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = ()=>resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      const id = uid()+"_"+Date.now();
      await Store.setAttachment(id, {dataUrl, name:file.name, type:file.type, size:file.size, uploadedAt: nowISO()});
      detail.comprovacaoId = id;
    }
    if(!detail.comprovacaoId){
      return {ok:false, msg:"Anexe a comprovação (print do cliente falando de preço, ou orçamento/card da concorrência) antes de salvar."};
    }
  }else if(kind==="giro"){
    detail.linhasCompradas = Array.from(root.querySelectorAll(`.${prefix}_linhasCompradas:checked`)).map(el=>el.value);
    if(!detail.linhasCompradas.length) return {ok:false, msg:"Marque ao menos uma linha que o cliente compra."};
  }else if(kind==="estoque"){
    detail.itemFaltante = (root.querySelector(`#${prefix}_itemFaltante`)||{}).value || "";
    detail.quantidadeDesejada = Number((root.querySelector(`#${prefix}_quantidadeDesejada`)||{}).value || 0) || null;
    if(!detail.itemFaltante) return {ok:false, msg:"Informe o item que fez perder o pedido."};
  }else if(kind==="meios"){
    detail.meiosTentados = Array.from(root.querySelectorAll(`.${prefix}_meiosTentados:checked`)).map(el=>el.value);
    if(!detail.meiosTentados.length) return {ok:false, msg:"Marque ao menos um meio de contato tentado."};
  }
  return {ok:true, detail};
}

/* ============================= STAGE CHANGE (guarded) ============================= */
function requestStageChange(lead, newStage){
  if(!lead || lead.stage===newStage) return;
  if(lead.stage==="inativo" && newStage==="inativam"){
    toast('Não é possível voltar um cliente de "Inativado" para "Inativam no mês".', "err");
    return;
  }
  openStageChangeModal(lead, newStage);
}

function fieldLabel(key){
  return {
    obs:"CRM - resumo do último contato", dtUltimoContato:"Data do último contato", dtProximoContato:"Data do próximo contato",
    horaProximoContato:"Horário do próximo contato",
    valorProposta:"Valor da proposta", linhasPositivadas:"Linhas positivadas", ofensor:"Ofensor",
    contatoDecisor:"Nome do contato decisor", whatsapp:"WhatsApp"
  }[key] || key;
}

function openStageChangeModal(lead, newStage){
  const required = requiredFieldsForMove(lead.stage, newStage);
  const stageLabel = STAGES.find(s=>s.key===newStage).label;
  const root = document.getElementById("modalRoot");
  const needs = k => required.includes(k);
  root.innerHTML = `
  <div class="overlay" id="stageOverlay">
    <div class="modal w-lead">
      <div class="modal-head">
        <div><h2>Mover para "${escapeHtml(stageLabel)}"</h2><div class="sub">${escapeHtml(lead.cli||"")} · Cód ${escapeHtml(lead.cod)}</div></div>
        <button class="modal-close" id="stageClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>CRM - resumo breve do último contato com o cliente *</label>
          <textarea class="form-input" id="stg_obs" placeholder="Descreva o contato/decisão..."></textarea>
        </div>
        ${(needs("dtUltimoContato")||needs("dtProximoContato")||needs("horaProximoContato")) ? `
        <div class="section-title">Contato</div>
        <div class="grid2">
          ${needs("dtUltimoContato") ? `<div class="field"><label>Data do último contato *</label><input class="form-input" type="date" id="stg_dtUltimoContato" value="${lead.dtUltimoContato||""}"></div>` : ""}
          ${needs("dtProximoContato") ? `<div class="field"><label>Data do próximo contato (agendar) *</label><input class="form-input" type="date" id="stg_dtProximoContato" value="${lead.dtProximoContato||""}"></div>` : ""}
          ${needs("horaProximoContato") ? `<div class="field"><label>Horário do próximo contato *</label><input class="form-input" type="time" id="stg_horaProximoContato" value="${lead.horaProximoContato||""}"></div>` : ""}
        </div>` : ""}
        ${(needs("contatoDecisor")||needs("whatsapp")) ? `
        <div class="section-title">Decisor</div>
        <div class="grid2">
          ${needs("contatoDecisor") ? `<div class="field"><label>Nome do contato decisor *</label><input class="form-input" type="text" id="stg_contatoDecisor" placeholder="Nome de quem decide" value="${escapeHtml(lead.contatoDecisor||"")}"></div>` : ""}
          ${needs("whatsapp") ? `<div class="field">
            <label>WhatsApp *</label>
            <input class="form-input" type="text" id="stg_whatsapp" placeholder="(00) 00000-0000" value="${escapeHtml(lead.whatsapp||"")}" ${lead.whatsappIndisponivel?"disabled":""}>
            <label style="flex-direction:row; align-items:center; gap:6px; margin-top:6px; font-weight:500; text-transform:none; letter-spacing:0; font-size:12px; cursor:pointer;">
              <input type="checkbox" id="stg_semWhatsapp" style="margin:0;" ${lead.whatsappIndisponivel?"checked":""}> Não tenho o WhatsApp deste lead
            </label>
          </div>` : ""}
        </div>` : ""}
        ${(needs("valorProposta")||needs("linhasPositivadas")) ? `
        <div class="section-title">Proposta</div>
        <div class="grid2">
          ${needs("valorProposta") ? `<div class="field"><label>Valor da proposta (R$) *</label><input class="form-input" type="number" step="0.01" id="stg_valorProposta" value="${lead.valorProposta||""}"></div>` : ""}
          ${needs("linhasPositivadas") ? `<div class="field"><label>Linhas positivadas *</label><div class="stage-row">${LINHAS_OPTIONS.map(o=>`<label class="stage-pill" style="cursor:pointer;"><input type="checkbox" class="visually-hidden stg_linhas" value="${o}" ${((lead.linhasPositivadas||[]).includes(o))?"checked":""}> ${o}</label>`).join("")}</div></div>` : ""}
        </div>` : ""}
        ${needs("ofensor") ? `
        <div class="section-title">Ofensor</div>
        <div class="field"><label>Ofensor *</label>
          <select class="form-input" id="stg_ofensor"><option value="">—</option>${OFENSOR_OPTIONS.map(o=>`<option ${lead.ofensor===o?"selected":""}>${o}</option>`).join("")}</select>
        </div>
        <div id="stg_ofensorDetailWrap">${ofensorDetailFieldsHtml(lead.ofensor||"", lead.ofensorDetalhe, "stg")}</div>
        ` : ""}
      </div>
      <div class="modal-foot">
        <span class="save-indicator" id="stgSaveIndicator"></span>
        <button class="btn btn-subtle" id="stgCancel">Cancelar</button>
        <button class="btn btn-primary" id="stgConfirm">Confirmar movimentação</button>
      </div>
    </div>
  </div>`;
  document.getElementById("stageClose").onclick = closeModal;
  document.getElementById("stgCancel").onclick = closeModal;
  document.getElementById("stageOverlay").addEventListener("click",(e)=>{ if(e.target.id==="stageOverlay") closeModal(); });
  wireOfensorPills(root, "stg");
  root.querySelectorAll(".stg_linhas").forEach(cb=>{
    cb.addEventListener("change", ()=> cb.closest(".stage-pill").classList.toggle("on", cb.checked));
    if(cb.checked) cb.closest(".stage-pill").classList.add("on");
  });
  const ofensorSel = document.getElementById("stg_ofensor");
  if(ofensorSel){
    ofensorSel.addEventListener("change", ()=>{
      document.getElementById("stg_ofensorDetailWrap").innerHTML = ofensorDetailFieldsHtml(ofensorSel.value, null, "stg");
      wireOfensorPills(root, "stg");
    });
  }
  const stgSemWhatsapp = document.getElementById("stg_semWhatsapp");
  if(stgSemWhatsapp){
    stgSemWhatsapp.addEventListener("change", ()=>{
      const inp = document.getElementById("stg_whatsapp");
      inp.disabled = stgSemWhatsapp.checked;
      if(stgSemWhatsapp.checked) inp.value = "";
    });
  }
  document.getElementById("stgConfirm").onclick = async ()=>{
    const obs = document.getElementById("stg_obs").value.trim();
    if(!obs){ toast("O CRM (resumo do contato) é obrigatório para movimentar o card.", "err"); return; }
    const updates = {};
    if(needs("dtUltimoContato")){
      const v = document.getElementById("stg_dtUltimoContato").value;
      if(!v){ toast("Informe a data do último contato.", "err"); return; }
      updates.dtUltimoContato = v;
    }
    if(needs("dtProximoContato")){
      const v = document.getElementById("stg_dtProximoContato").value;
      if(!v){ toast("Informe a data do próximo contato.", "err"); return; }
      updates.dtProximoContato = v;
    }
    if(needs("horaProximoContato")){
      const v = document.getElementById("stg_horaProximoContato").value;
      if(!v){ toast("Informe o horário do próximo contato.", "err"); return; }
      updates.horaProximoContato = v;
    }
    if(needs("contatoDecisor")){
      const v = document.getElementById("stg_contatoDecisor").value.trim();
      if(!v){ toast("Informe o nome do contato decisor.", "err"); return; }
      updates.contatoDecisor = v;
    }
    if(needs("whatsapp")){
      const semWpp = document.getElementById("stg_semWhatsapp").checked;
      const v = document.getElementById("stg_whatsapp").value.trim();
      if(!semWpp && !v){ toast("Informe o WhatsApp do lead ou marque \"Não tenho o WhatsApp deste lead\".", "err"); return; }
      updates.whatsapp = semWpp ? null : v;
      updates.whatsappIndisponivel = semWpp;
    }
    if(needs("valorProposta")){
      const v = document.getElementById("stg_valorProposta").value;
      if(!v){ toast("Informe o valor da proposta.", "err"); return; }
      updates.valorProposta = Number(v);
    }
    if(needs("linhasPositivadas")){
      const v = Array.from(root.querySelectorAll(".stg_linhas:checked")).map(el=>el.value);
      if(!v.length){ toast("Selecione ao menos uma linha positivada.", "err"); return; }
      updates.linhasPositivadas = v;
    }
    let ofensorDetail = lead.ofensorDetalhe;
    if(needs("ofensor")){
      const v = ofensorSel.value;
      if(!v){ toast("Selecione o ofensor.", "err"); return; }
      updates.ofensor = v;
      const res = await collectOfensorDetail(root, v, lead.ofensorDetalhe, "stg");
      if(!res.ok){ toast(res.msg, "err"); return; }
      ofensorDetail = res.detail;
    }
    document.getElementById("stgSaveIndicator").innerHTML = '<span class="spinner"></span> salvando...';
    Object.assign(lead, updates);
    if(ofensorDetail) lead.ofensorDetalhe = ofensorDetail;
    const fromLabel = STAGES.find(s=>s.key===lead.stage).label;
    lead.stage = newStage;
    lead.notes = obs;
    lead.lastTouched = nowISO();
    pushHist(lead, `Movido de "${fromLabel}" para "${stageLabel}" — ${obs}`);
    await persistLead(lead);
    toast("Movimentação registrada.");
    closeModal();
    renderAll();
    // Sempre mostra o histórico de movimentação/observações ao movimentar o card.
    openLeadModal(lead.cod);
  };
}

const HEADER_ALIASES = {
  "cliente":"cli", "cod cliente":"cod","codigo cliente":"cod", "cod grupo":"codGrupo",
  "grupo de cliente":"grp","telefone":"tel","email":"email","uf":"uf","cidade":"cid","segmento":"seg",
  "tem carteira":"temCarteira","total pedidos pendentes":"pedPend","inadimplente":"inad","valor vencido":"valVenc",
  "data cadastro":"dtCad","data 1 faturamento":"dt1Fat","data ultimo faturamento":"dtUltFat","data inativacao":"dtInat",
  "status atual":"statusErp","faturamento comercial (nf venda - nf dev)":"fatCom","data ultimo pedido aberto":"dtUltPedAberto",
  "representante (z1)":"rep","vendedor interno (ve)":"vendInt","key account (z3)":"keyAcc","prospect (z5)":"prospect",
  "sucesso do cliente (z6)":"sucCli","cnpj":"cnpj","razao social":"cli"
};
// Fallback keyword rules, tried when a header doesn't match HEADER_ALIASES
// exactly (e.g. slightly different spacing/punctuation around "(Z1)" etc. in
// a real ERP export). Order matters: first matching rule wins. This keeps
// Vendedor/Time derivation working even if a future export's header text
// drifts a little from the original file we built HEADER_ALIASES from.
const HEADER_KEYWORD_RULES = [
  ["representante","rep"],
  ["vendedor interno","vendInt"],
  ["key account","keyAcc"],
  ["prospect","prospect"],
  ["sucesso do cliente","sucCli"],
  ["razao social","cli"],
  ["cnpj","cnpj"],
  ["cod cliente","cod"],["codigo cliente","cod"],
  ["data inativ","dtInat"],
  ["data ultimo faturamento","dtUltFat"],
  ["status atual","statusErp"]
];
function aliasHeader(h){
  const n = norm(h).replace(/[º°]/g,"").replace(/\s+/g," ").trim();
  if(HEADER_ALIASES[n]) return HEADER_ALIASES[n];
  for(const [kw, key] of HEADER_KEYWORD_RULES){
    if(n.includes(kw)) return key;
  }
  return null;
}
function excelDateToISO(v){
  if(v==null || v==="" || v==="-") return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v === "number"){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0].slice(0,10);
  return null;
}
function cleanTxt(v){
  if(v==null) return null;
  const s = String(v).trim();
  return (s==="" || s==="-") ? null : s;
}
function cleanNum(v){
  if(v==null || v==="") return 0;
  const n = Number(String(v).replace(/\./g,"").replace(",", "."));
  return isNaN(n) ? (Number(v)||0) : n;
}

function parseWorkbook(buffer){
  const wb = XLSX.read(buffer, {type:"array", cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  if(!rows.length) return [];
  const headerRow = rows[0];
  const colMap = headerRow.map(aliasHeader);
  const out = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    if(!row || row.every(c=>c==null||c==="")) continue;
    const rec = {};
    colMap.forEach((key,idx)=>{ if(key) rec[key] = row[idx]; });
    if(!rec.cod) continue;
    const dtInat = excelDateToISO(rec.dtInat);
    const dtUltFat = excelDateToISO(rec.dtUltFat);
    out.push({
      cod: cleanTxt(rec.cod), cli: cleanTxt(rec.cli), cnpj: cleanTxt(rec.cnpj),
      uf: cleanTxt(rec.uf), cid: cleanTxt(rec.cid), seg: cleanTxt(rec.seg),
      tel: cleanTxt(rec.tel), email: cleanTxt(rec.email),
      temCarteira: cleanTxt(rec.temCarteira), pedPend: cleanNum(rec.pedPend),
      inad: cleanTxt(rec.inad), valVenc: cleanNum(rec.valVenc),
      dtCad: excelDateToISO(rec.dtCad), dt1Fat: excelDateToISO(rec.dt1Fat),
      dtUltFat, dtInat, statusErp: cleanTxt(rec.statusErp), fatCom: cleanNum(rec.fatCom),
      dtUltPedAberto: excelDateToISO(rec.dtUltPedAberto),
      rep: cleanTxt(rec.rep), vendInt: cleanTxt(rec.vendInt), keyAcc: cleanTxt(rec.keyAcc),
      prospect: cleanTxt(rec.prospect), sucCli: cleanTxt(rec.sucCli)
    });
  }
  return out.filter(r=>r.dtInat); // only rows with a usable inactivation date can be tracked
}

async function handleFile(file){
  const statusEl = document.getElementById("impStatus");
  statusEl.innerHTML = '<span class="spinner"></span> Lendo planilha...';
  try{
    const buf = await file.arrayBuffer();
    const rows = parseWorkbook(buf);
    if(!rows.length){ statusEl.textContent = "Não encontrei linhas válidas (verifique as colunas Cód Cliente e Data Inativação)."; return; }
    const byMonth = {};
    rows.forEach(r=>{ (byMonth[r.dtInat.slice(0,7)] = byMonth[r.dtInat.slice(0,7)]||[]).push(r); });

    statusEl.innerHTML = '<span class="spinner"></span> Comparando com a base atual...';
    const summary = [];
    for(const mk of Object.keys(byMonth).sort()){
      const {meta} = await ensureMonthLoaded(mk);
      const existingCods = meta ? new Set(Object.keys(meta.codToChunk||{})) : new Set();
      const incoming = byMonth[mk];
      const novos = incoming.filter(r=>!existingCods.has(r.cod)).length;
      const atualizados = incoming.length - novos;
      summary.push({mk, novos, atualizados, total: incoming.length});
    }
    renderImportSummary(file, byMonth, summary);
  }catch(err){
    console.error(err);
    statusEl.textContent = "Não consegui ler esse arquivo. Confirme que é um .xlsx exportado do ERP.";
  }
}

const CHUNK_SIZE = 140;
async function commitMonthImport(monthKey, incomingRows, onProgress){
  let {meta, leads} = await ensureMonthLoaded(monthKey);
  const byCod = {};
  leads.forEach(l=>{ byCod[l.cod] = l; });
  if(!meta){
    meta = {monthKey, importedAt: nowISO(), sourceFilename:"", totalLeads:0, chunkCount:0, codToChunk:{}};
  }
  const chunkCache = {}; // ci -> {leads:[]}
  async function getChunkCached(ci){
    if(chunkCache[ci]) return chunkCache[ci];
    const c = await Store.getChunk(monthKey, ci);
    c.leads = c.leads || [];
    chunkCache[ci] = c;
    return c;
  }
  let lastChunk = meta.chunkCount>0 ? await getChunkCached(meta.chunkCount-1) : null;
  let lastIdx = meta.chunkCount>0 ? meta.chunkCount-1 : -1;
  if(lastIdx<0 || (lastChunk && lastChunk.leads.length>=CHUNK_SIZE)){
    lastIdx = meta.chunkCount; lastChunk = {leads:[]}; chunkCache[lastIdx] = lastChunk; meta.chunkCount = lastIdx+1;
  }

  let n=0;
  for(const fresh of incomingRows){
    const existing = byCod[fresh.cod];
    const merged = applyImportToLead(existing, fresh, monthKey);
    if(existing){
      const ci = meta.codToChunk[fresh.cod];
      const chunk = await getChunkCached(ci);
      const idx = chunk.leads.findIndex(x=>x.cod===fresh.cod);
      if(idx>=0) chunk.leads[idx] = merged; else chunk.leads.push(merged);
    }else{
      if(lastChunk.leads.length>=CHUNK_SIZE){
        lastIdx = meta.chunkCount; lastChunk = {leads:[]}; chunkCache[lastIdx] = lastChunk; meta.chunkCount = lastIdx+1;
      }
      lastChunk.leads.push(merged);
      meta.codToChunk[fresh.cod] = lastIdx;
    }
    byCod[fresh.cod] = merged;
    n++;
    if(n%25===0) onProgress(25);
  }
  onProgress(n%25);

  for(const ci of Object.keys(chunkCache)){
    await Store.setChunk(monthKey, Number(ci), chunkCache[ci]);
  }
  meta.totalLeads = Object.keys(meta.codToChunk).length;
  meta.importedAt = nowISO();
  await Store.setMeta(monthKey, meta);
  state._monthCache[monthKey] = null;
}

// Shared xlsx download helper (used by the pipeline export and the
// Comparativo & histórico export): sheets = [{name, rows}], rows = array of
// plain objects (json_to_sheet-compatible).
async function downloadWorkbook(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(({name, rows})=>{
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  const out = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  const blob = new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  if(downloadsNS){
    try{
      await downloadsNS.save({filename, data:blob});
      toast("Arquivo exportado.");
    }catch(err){
      if(err && err.code==="declined") return;
      toast("Não foi possível exportar agora.", "err");
    }
  }else{
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast("Arquivo exportado.");
    }catch(err){
      toast("Não foi possível exportar agora.", "err");
    }
  }
}

// Small overlay/modal used to show an enlarged copy of a chart — reuses the
// same .overlay/.modal.w-wide markup/CSS as the other modals in the app.
function openChartModal(title, bodyHtml){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="overlay" id="chartOverlay">
    <div class="modal w-wide">
      <div class="modal-head"><div><h2>${escapeHtml(title)}</h2></div><button class="modal-close" id="chartClose">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  </div>`;
  document.getElementById("chartClose").onclick = closeModal;
  document.getElementById("chartOverlay").addEventListener("click", (e)=>{ if(e.target.id==="chartOverlay") closeModal(); });
}

function slugify(s){
  return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"").toLowerCase() || "dados";
}

// Popup de drilldown: aberto ao clicar em uma linha/segmento/barra de qualquer
// gráfico do Dashboard — mostra a lista de clientes daquele recorte específico,
// com botão próprio para exportar somente esses clientes em Excel.
function openDrilldownModal(title, leads){
  leads = leads || [];
  const rowsHtml = leads.map((l,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${fmtDate(l.dtInat)}</td>
      <td>${escapeHtml((STAGES.find(s=>s.key===l.stage)||{}).label||"—")}</td>
      <td>${escapeHtml(l.cli||"—")}</td>
      <td>${escapeHtml(l.seg||"—")}</td>
      <td>${escapeHtml(l.vendedor||"—")}</td>
      <td>${escapeHtml(l.time||"—")}</td>
      <td>${escapeHtml(l.cid||"—")}</td>
    </tr>`).join("");
  const bodyHtml = `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
      <div class="sub-note" style="margin:0;">${leads.length} cliente(s) encontrado(s).</div>
      <button type="button" class="btn btn-primary" id="drillExportBtn">⬇ Exportar Excel</button>
    </div>
    <div style="max-height:60vh; overflow:auto; border:1px solid var(--border-soft); border-radius:8px;">
      <table class="cmp-table" style="width:100%;">
        <thead><tr><th>Nº</th><th>Data</th><th>Status</th><th>Razão Social</th><th>Segmento</th><th>Prospect</th><th>Time</th><th>Cidade</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="8" style="text-align:center; color:var(--ink-faint); padding:20px;">Nenhum cliente encontrado.</td></tr>`}</tbody>
      </table>
    </div>`;
  openChartModal(`${title} (${leads.length})`, bodyHtml);
  const btn = document.getElementById("drillExportBtn");
  if(btn){
    btn.addEventListener("click", async ()=>{
      if(!leads.length){ toast("Não há dados para exportar.", "err"); return; }
      await downloadWorkbook([{name: title.slice(0,31), rows: leads.map(leadExportRow)}], `drilldown_${slugify(title)}_${state.monthKey}.xlsx`);
    });
  }
}

// informações de CRM (resumo de contato, data do último contato, decisor ou
// WhatsApp) nos leads sob sua responsabilidade — sempre mostrando o time do
// vendedor ao lado do nome, para dar contexto de a qual equipe ele pertence.
function openVendorUpdatesModal(rows){
  rows = rows || [];
  const rowsHtml = rows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${escapeHtml(r.vendedor)} <span style="color:var(--ink-faint); font-weight:600;">(${escapeHtml(r.time)})</span></td>
      <td class="mono">${r.atualizados}</td>
      <td class="mono">${r.total}</td>
      <td class="mono">${pct(r.atualizados, r.total)}%</td>
    </tr>`).join("");
  const bodyHtml = `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
      <div class="sub-note" style="margin:0;">${rows.length} vendedor(es) com leads no período. Ranking por leads com informações de CRM preenchidas (resumo de contato, data do último contato, decisor ou WhatsApp).</div>
      <button type="button" class="btn btn-primary" id="vendorUpdatesExportBtn">⬇ Exportar Excel</button>
    </div>
    <div style="max-height:60vh; overflow:auto; border:1px solid var(--border-soft); border-radius:8px;">
      <table class="cmp-table" style="width:100%;">
        <thead><tr><th>Nº</th><th>Vendedor (Time)</th><th>Leads com CRM preenchido</th><th>Total de leads</th><th>% preenchido</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" style="text-align:center; color:var(--ink-faint); padding:20px;">Nenhum vendedor encontrado no período.</td></tr>`}</tbody>
      </table>
    </div>`;
  openChartModal(`Atualização de CRM por vendedor (${rows.length})`, bodyHtml);
  const btn = document.getElementById("vendorUpdatesExportBtn");
  if(btn){
    btn.addEventListener("click", async ()=>{
      if(!rows.length){ toast("Não há dados para exportar.", "err"); return; }
      const exportRows = rows.map(r=>({
        "Vendedor": r.vendedor, "Time": r.time,
        "Leads com CRM preenchido": r.atualizados, "Total de leads": r.total,
        "% preenchido": pct(r.atualizados, r.total)
      }));
      await downloadWorkbook([{name: "Atualização por vendedor", rows: exportRows}], `atualizacao_por_vendedor_${state.monthKey}.xlsx`);
    });
  }
}

function activeFilterSummary(){
  const labels = {periodo:"Período", acao:"Ação", time:"Time", vendedor:"Vendedor", status:"Status", seg:"Segmento", uf:"UF", ofensor:"Ofensor"};
  const parts = Object.entries(state.filters).filter(([,s])=>s.size).map(([k,s])=>`${labels[k]} (${s.size})`);
  if(state.shortcut){ const sc = SHORTCUTS.find(s=>s.key===state.shortcut); if(sc) parts.push(sc.label); }
  if(state.bulkSelected && state.bulkSelected.size) parts.push(`${state.bulkSelected.size} selecionado(s) em massa`);
  if(state.search) parts.push(`Busca "${state.search}"`);
  return parts;
}

async function renderComparativo(){
  const wrap = document.getElementById("viewComparativo");
  wrap.innerHTML = `<div class="panel" style="padding:40px; text-align:center; color:var(--ink-faint);"><span class="spinner"></span> Carregando histórico...</div>`;
  const months = await Store.listMonths();
  const sorted = months.filter(m=>m.monthKey>=TRACKING_START).sort((a,b)=>a.monthKey.localeCompare(b.monthKey));
  if(!sorted.length){
    wrap.innerHTML = `<div class="panel empty-state"><h3>Nenhum histórico ainda</h3><p>Assim que você importar dados de mais de um mês, o comparativo aparece aqui.</p></div>`;
    return;
  }
  // Same filter logic used in the Pipeline (Período, Ação, Time, Vendedor,
  // Status, Segmento, UF, Ofensor, atalho, seleção em massa e busca): every
  // active filter narrows the comparativo's data too, across every month —
  // not just whichever month happens to be open in the kanban.
  const rows = [];
  const filteredLeadsAll = [];
  for(const m of sorted){
    const {leads} = await ensureMonthLoaded(m.monthKey);
    const filtered = leads.filter(l=>matchesFilters(l, false));
    filteredLeadsAll.push(...filtered);
    const impedido = filtered.filter(l=>l.status==="impedido").length;
    const recuperado = filtered.filter(l=>l.status==="recuperado").length;
    const perdido = filtered.filter(l=>l.status==="perdido").length;
    const pendente = filtered.filter(l=>l.status==="pendente").length;
    const resolved = impedido+recuperado+perdido;
    rows.push({mk:m.monthKey, total:filtered.length, impedido, recuperado, perdido, pendente, reversao: pct(impedido+recuperado, resolved)});
  }
  const filterParts = activeFilterSummary();
  const filterNote = filterParts.length
    ? `<div style="font-size:11px; color:var(--accent); font-weight:600; margin-bottom:8px;">Filtros aplicados: ${filterParts.map(escapeHtml).join(" · ")}</div>`
    : "";
  const maxTotal = Math.max(...rows.map(r=>r.total), 1);
  const W=560,H=220,PAD=32;
  const bw = (W-PAD*2)/rows.length;
  function barsSvg(){
    return rows.map((r,i)=>{
      const x = PAD + i*bw + bw*0.15;
      const bwi = bw*0.7;
      const scale = (H-PAD*2)/maxTotal;
      let y = H-PAD;
      const segs = [["impedido",r.impedido,"var(--good)"],["recuperado",r.recuperado,"var(--accent)"],["perdido",r.perdido,"var(--bad)"],["pendente",r.pendente,"var(--cold)"]];
      let out = "";
      segs.forEach(([key,val,color])=>{
        const h = val*scale;
        y -= h;
        out += `<rect x="${x}" y="${y}" width="${bwi}" height="${h}" fill="${color}"></rect>`;
      });
      out += `<text x="${x+bwi/2}" y="${H-PAD+16}" font-size="10" text-anchor="middle" fill="var(--ink-faint)">${fmtMonthKey(r.mk).split("/")[0].slice(0,3)}</text>`;
      return out;
    }).join("");
  }
  const legendHtml = `
    <div class="legend">
      <span><i style="background:var(--good)"></i>Impedido</span>
      <span><i style="background:var(--accent)"></i>Recuperado</span>
      <span><i style="background:var(--bad)"></i>Perdido</span>
      <span><i style="background:var(--cold)"></i>Pendente</span>
    </div>`;
  const chartSvgHtml = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
      <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD}" y2="${H-PAD}" stroke="var(--border)"></line>
      ${barsSvg()}
    </svg>`;
  wrap.innerHTML = `
    ${filterNote}
    <div class="cmp-grid">
      <div class="panel cmp-card">
        <h3 style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span>Volume mensal por desfecho</span>
          <button type="button" class="btn btn-subtle" id="cmpExpandBtn" style="padding:5px 9px; font-size:11px;">⤢ Expandir</button>
        </h3>
        ${legendHtml}
        ${chartSvgHtml}
      </div>
      <div class="panel cmp-card">
        <h3 style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span>Resumo por mês</span>
          <button type="button" class="btn btn-subtle" id="cmpExportBtn" style="padding:5px 9px; font-size:11px;">⬇ Exportar Excel</button>
        </h3>
        <div style="overflow-x:auto;">
        <table class="cmp-table">
          <thead><tr><th>Mês</th><th>Total</th><th>Impedido</th><th>Recuperado</th><th>Perdido</th><th>% Reversão</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${fmtMonthKey(r.mk)}</td><td class="num">${r.total}</td><td class="num">${r.impedido}</td><td class="num">${r.recuperado}</td><td class="num">${r.perdido}</td><td class="num">${r.reversao}%</td></tr>`).join("")}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  `;
  document.getElementById("cmpExpandBtn").addEventListener("click", ()=>{
    openChartModal("Volume mensal por desfecho", filterNote + legendHtml + `<div style="max-height:70vh;">${chartSvgHtml}</div>`);
  });
  document.getElementById("cmpExportBtn").addEventListener("click", async ()=>{
    if(!filteredLeadsAll.length){ toast("Não há dados para exportar com os filtros atuais.", "err"); return; }
    await downloadWorkbook([
      {name:"Resumo mensal", rows: rows.map(r=>({
        "Mês": fmtMonthKey(r.mk), "Total": r.total, "Impedido": r.impedido, "Recuperado": r.recuperado,
        "Perdido": r.perdido, "Pendente": r.pendente, "% Reversão": r.reversao
      }))},
      {name:"Leads detalhados", rows: filteredLeadsAll.map(leadExportRow)}
    ], `comparativo_historico${filterParts.length?"_filtrado":""}.xlsx`);
  });
}

/* ============================= LOAD / RENDER ORCHESTRATION ============================= */
async function loadMonths(){
  state.months = await Store.listMonths();
}
async function setMonth(monthKey){
  state.monthKey = monthKey;
  state.loading = true;
  renderAll();
  const {meta, leads} = await ensureMonthLoaded(monthKey);
  state.meta = meta;
  state.leads = leads;
  await applyAutoInativoTransitions();
  state.loading = false;
  Object.values(state.filters).forEach(s=>s.clear());
  state.shortcut = null;
  state.bulkSelected = new Set();
  renderAll();
}

// Requirement: um lead ainda parado em "Inativam no mês" (o vendedor nunca o
// movimentou manualmente) cuja data de inativação já tenha chegado deve ser
// automaticamente movido para "Inativo". Se o vendedor já tiver movimentado o
// lead para qualquer outro estágio, esta regra nunca se aplica (o progresso
// manual nunca é sobrescrito).
async function applyAutoInativoTransitions(){
  if(!state.meta || !state.leads.length) return;
  const touchedChunks = new Set();
  let anyChange = false;
  state.leads.forEach(l=>{
    if(l.stage==="inativam"){
      const d = daysUntil(l.dtInat);
      if(d!=null && d<=0){
        l.stage = "inativo";
        l.lastTouched = nowISO();
        pushHist(l, `Movido automaticamente para "Inativado" — data de inativação (${fmtDate(l.dtInat)}) já foi atingida.`);
        anyChange = true;
        const ci = state.meta.codToChunk ? state.meta.codToChunk[l.cod] : null;
        if(ci!=null) touchedChunks.add(ci);
      }
    }
  });
  if(!anyChange) return;
  for(const ci of touchedChunks){
    try{
      const chunk = await Store.getChunk(state.monthKey, ci);
      (chunk.leads||[]).forEach((cl, idx)=>{
        const updated = state.leads.find(l=>l.cod===cl.cod);
        if(updated) chunk.leads[idx] = updated;
      });
      await Store.setChunk(state.monthKey, ci, chunk);
    }catch(err){ console.error(err); }
  }
  if(state._monthCache && state._monthCache[state.monthKey]) state._monthCache[state.monthKey].leads = state.leads;
}

function renderHeaderTicker(){
  const wrap = document.getElementById("headerTicker");
  if(!wrap) return;
  const today = new Date();
  const sched = scheduleForWeekday(today.getDay());
  const dayNameFull = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"][today.getDay()];
  const quote = motivationalQuoteForToday();
  const quoteHtml = `
    <div class="ht-quote-wrap">
      <div class="ht-quote">💬 “${escapeHtml(quote)}”</div>
    </div>`;
  if(!sched){
    // Fim de semana: sem cronograma comercial, só a frase do dia.
    wrap.innerHTML = `
      <div class="ht-day-chip">📅 ${dayNameFull}</div>
      ${quoteHtml}`;
    return;
  }
  wrap.innerHTML = `
    <div class="ht-day-chip">${sched.icon} ${dayNameFull}</div>
    <div class="ht-items">${sched.itens.map(it=>`<span class="ht-item">${escapeHtml(it)}</span>`).join("")}</div>
    <div class="ht-sep"></div>
    ${quoteHtml}`;
}

function updateNavButtonsActive(){
  document.querySelectorAll(".btn-nav[data-view]").forEach(btn=>{
    btn.classList.toggle("active", state.view===btn.dataset.view);
  });
  document.querySelectorAll(".tab[data-view]").forEach(t=>{
    t.classList.toggle("active", state.view===t.dataset.view);
  });
}

function renderAll(){
  renderHeaderTicker();
  updateNavButtonsActive();
  renderFilterbar();
  renderShortcuts();
  document.getElementById("viewKanban").style.display = state.view==="kanban" ? "" : "none";
  document.getElementById("viewDashboard").style.display = state.view==="dashboard" ? "" : "none";
  document.getElementById("viewComparativo").style.display = state.view==="comparativo" ? "" : "none";
  document.getElementById("viewAgenda").style.display = state.view==="agenda" ? "" : "none";
  if(state.view==="kanban"){
    if(state.loading){
      document.getElementById("board").innerHTML = `<div class="panel empty-state" style="grid-column:1/-1;"><span class="spinner"></span></div>`;
    }else if(!state.meta || !state.leads.length){
      document.getElementById("board").innerHTML = `<div class="panel empty-state" style="grid-column:1/-1; width:100%;"><h3>Nenhum lead neste período</h3><p>Use "Importação" para carregar a planilha de clientes que inativam em ${fmtMonthKey(state.monthKey)}.</p></div>`;
    }else{
      renderBoard();
    }
  }else if(state.view==="dashboard"){
    // Fire-and-forget: renderDashboard() is async (a-la comparativo) because
    // the R$ reversion evolution chart iterates every tracked month.
    renderDashboard();
  }else if(state.view==="comparativo"){
    // Fire-and-forget: keeps the comparativo view in sync whenever a filter
    // changes while that tab is already open, not just on first tab click.
    renderComparativo();
  }else if(state.view==="agenda"){
    renderAgenda();
  }
}

/* ============================= LEMBRETES DE LIGAÇÃO (notificação do sistema) =============================
   Verifica a cada minuto se algum lead tem dtProximoContato+horaProximoContato
   batendo com o horário atual e dispara uma notificação do sistema operacional
   (Notification API) — não apenas um alerta dentro da aba da Pipeline — além
   de um toque sonoro simples via AudioContext. Cada lead só é notificado uma
   vez por minuto/execução (chave cod|data|hora registrada em state.notifiedKeys). */
function playReminderChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,180,360].forEach(delay=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.28);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.3);
      }, delay);
    });
  }catch(err){ /* AudioContext indisponível — ignora silenciosamente */ }
}
function requestNotificationPermission(){
  if(typeof Notification==="undefined"){ toast("Este navegador não suporta notificações do sistema.", "err"); return; }
  Notification.requestPermission().then(p=>{
    state.notifPermission = p;
    if(p==="granted") toast("Lembretes de ligação ativados neste computador.", "ok");
    else toast("Sem permissão de notificação — os lembretes só aparecerão dentro da aba.", "err");
  });
}
function checkCallReminders(){
  if(!state.leads || !state.leads.length) return;
  const now = new Date();
  const todayStr = isoDateLocal(now);
  const hhmm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  state.leads.forEach(l=>{
    if(l.dtProximoContato!==todayStr || !l.horaProximoContato) return;
    if(l.horaProximoContato!==hhmm) return;
    const key = l.cod+"|"+l.dtProximoContato+"|"+l.horaProximoContato;
    if(state.notifiedKeys.has(key)) return;
    state.notifiedKeys.add(key);
    playReminderChime();
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      try{
        const n = new Notification("📞 Ligação agendada agora — "+(l.cli||"Cliente"), {
          body: "Horário: "+l.horaProximoContato+(l.tel?" · Tel: "+l.tel:""),
          tag: key
        });
        n.onclick = ()=>{ window.focus(); openContactPopup(l.cod); };
      }catch(err){ console.error(err); }
    }else{
      toast("📞 Ligação agendada agora com "+(l.cli||"cliente")+" ("+l.horaProximoContato+")", "warn");
    }
  });
}
setInterval(checkCallReminders, 30000);

async function boot(){
  await loadMonths();
  await setMonth(TRACKING_START);
  if(typeof Notification!=="undefined" && Notification.permission==="default"){
    // Pede permissão de forma discreta, sem travar o carregamento inicial.
    setTimeout(()=>{ toast('Ative os lembretes de ligação em "Gestão de Contatos" para receber avisos mesmo fora da aba.', "info"); }, 1500);
  }
}
})();
