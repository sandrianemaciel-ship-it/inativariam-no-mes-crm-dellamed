<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline de Retenção</title>
<style>
  :root{
    --bg:#f2f4fa;
    --surface:#ffffff;
    --surface-2:#eaeef8;
    --surface-3:#dde3f2;
    --ink:#101a33;
    --ink-dim:#57628a;
    --ink-faint:#8792b3;
    --border:#dbe1f0;
    --border-soft:#e8ecf7;
    --navy:#0b2f6b;
    --navy-2:#123a86;
    --navy-3:#0e2a5c;
    --accent:#2e5bff;
    --accent-soft:#e7ecff;
    --good:#137a4e;
    --good-soft:#e2f5ec;
    --warn:#b5730a;
    --warn-soft:#fdf0dc;
    --bad:#c02e3a;
    --bad-soft:#fbe6e8;
    --cold:#5c6a8f;
    --cold-soft:#eaedf6;
    --shadow:0 1px 2px rgba(16,26,51,.06), 0 8px 24px -12px rgba(16,26,51,.18);
    --shadow-lg:0 4px 10px rgba(16,26,51,.08), 0 24px 48px -20px rgba(16,26,51,.3);
    --radius:14px;
    --radius-sm:9px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1120;
      --surface:#131c30;
      --surface-2:#182338;
      --surface-3:#1f2c47;
      --ink:#eef1fb;
      --ink-dim:#a3adcc;
      --ink-faint:#6d7797;
      --border:#2a3554;
      --border-soft:#212c47;
      --navy:#16336f;
      --navy-2:#1c4291;
      --navy-3:#122a5c;
      --accent:#6d8cff;
      --accent-soft:#1c2b57;
      --good:#3fcf94;
      --good-soft:#123528;
      --warn:#f2ab3f;
      --warn-soft:#3a2c11;
      --bad:#ff6b76;
      --bad-soft:#3c1b21;
      --cold:#93a0c7;
      --cold-soft:#1c2440;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1120;
    --surface:#131c30;
    --surface-2:#182338;
    --surface-3:#1f2c47;
    --ink:#eef1fb;
    --ink-dim:#a3adcc;
    --ink-faint:#6d7797;
    --border:#2a3554;
    --border-soft:#212c47;
    --navy:#16336f;
    --navy-2:#1c4291;
    --navy-3:#122a5c;
    --accent:#6d8cff;
    --accent-soft:#1c2b57;
    --good:#3fcf94;
    --good-soft:#123528;
    --warn:#f2ab3f;
    --warn-soft:#3a2c11;
    --bad:#ff6b76;
    --bad-soft:#3c1b21;
    --cold:#93a0c7;
    --cold-soft:#1c2440;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:13.5px;
    line-height:1.45;
  }
  h1,h2,h3,h4{font-family:'Sora','Inter',system-ui,sans-serif; margin:0; text-wrap:balance;}
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; color:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;}

  /* ---------- App shell ---------- */
  #app{display:flex; flex-direction:column; min-height:100vh;}

  .topbar{
    background:linear-gradient(155deg,var(--navy) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:6px;}
  .brand-mark{
    width:32px;height:32px;border-radius:9px;
    background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
    border:1px solid rgba(255,255,255,.22);
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text b{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; letter-spacing:.2px;}
  .brand-text span{font-size:10.5px; color:rgba(255,255,255,.62); letter-spacing:.4px; text-transform:uppercase;}

  .searchwrap{
    flex:1 1 320px; min-width:220px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    display:flex; align-items:center; gap:8px;
    padding:9px 14px;
  }
  .searchwrap:focus-within{background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.35);}
  .searchwrap svg{flex:none; opacity:.7;}
  .searchwrap input{
    background:none;border:none;outline:none;color:#fff;
    width:100%; font-size:13px;
  }
  .searchwrap input::placeholder{color:rgba(255,255,255,.55);}

  .topbar-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:10px; padding:8px 13px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;
    transition:filter .12s, transform .05s;
  }
  .btn:hover{filter:brightness(0.97);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost-inverse{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.22); color:#fff;}
  .btn-ghost-inverse:hover{background:rgba(255,255,255,.18);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-subtle{background:var(--surface-2); border-color:transparent;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .user-chip{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:999px; padding:5px 12px 5px 5px; font-size:12px; font-weight:600;
  }
  .user-avatar{
    width:24px;height:24px;border-radius:999px; background:var(--accent);
    display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700;
  }

  .btn-nav{background:transparent; border-color:rgba(255,255,255,.22); color:rgba(255,255,255,.82);}
  .btn-nav:hover{background:rgba(255,255,255,.1); color:#fff;}
  .btn-nav.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .header-ticker{
    background:var(--navy-2); border-top:1px solid rgba(255,255,255,.08);
    padding:8px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-size:12px; color:rgba(255,255,255,.92);
  }
  .ht-day-chip{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; font-weight:700;
    white-space:nowrap;
  }
  .ht-items{display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:rgba(255,255,255,.85);}
  .ht-item{background:rgba(255,255,255,.06); border-radius:999px; padding:4px 10px; white-space:nowrap;}
  .ht-sep{width:1px; align-self:stretch; background:rgba(255,255,255,.15); margin:0 2px;}
  .ht-quote-wrap{flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:10px; min-width:0;}
  .header-ticker{padding-top:12px; padding-bottom:12px;}
  .ht-quote{
    font-style:italic; color:var(--accent-2, #ffd479); font-weight:800;
    font-size:20px; line-height:1.3; text-align:center; letter-spacing:.1px;
  }
  @media (max-width: 980px){ .ht-quote-wrap{flex-basis:100%; justify-content:flex-start;} .ht-quote{text-align:left; font-size:17px;} }

  .subbar{
    background:var(--navy-3);
    padding:0 22px;
    display:flex; gap:4px; flex-wrap:wrap;
  }
  .tab{
    padding:10px 16px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.6);
    border-bottom:2px solid transparent; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .tab.active{color:#fff; border-color:var(--accent);}
  .tab:hover:not(.active){color:rgba(255,255,255,.85);}

  main{padding:18px 22px 44px; display:flex; flex-direction:column; gap:16px;}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- filter row ---------- */
  .filterbar{padding:14px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px; min-width:150px;}
  .field label{font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-faint); display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .field-clear{font-size:11px; font-weight:800; color:var(--accent); background:none; border:none; cursor:pointer; padding:0 0 0 4px; text-transform:none; letter-spacing:0;}
  .field-clear:hover{color:var(--bad);}
  .select-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid var(--border); background:var(--surface); border-radius:10px;
    padding:8px 10px; font-size:12.5px; font-weight:600; cursor:pointer; min-width:150px;
    color:var(--ink);
  }
  .select-btn:hover{border-color:var(--ink-faint);}
  .select-btn.has-value{border-color:var(--accent); background:var(--accent-soft); color:var(--navy-3);}
  .select-btn .chev{opacity:.55; flex:none;}
  .select-btn .count-badge{
    background:var(--accent); color:#fff; border-radius:999px; font-size:10px; font-weight:700;
    padding:1px 6px; margin-left:4px;
  }
  .month-select{min-width:170px; font-weight:700;}
  .filter-clear{font-size:11.5px; color:var(--accent); font-weight:700; cursor:pointer; background:none; border:none; padding:8px 4px;}

  .popover{
    position:fixed; z-index:200; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow-lg); padding:8px; min-width:220px; max-height:320px;
    overflow-y:auto;
  }
  .popover-item{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:7px; cursor:pointer; font-size:12.5px;
  }
  .popover-item:hover{background:var(--surface-2);}
  .popover-item input{margin:0;}
  .popover-item .tag-dot{width:8px;height:8px;border-radius:999px; flex:none;}
  .popover-item .n{margin-left:auto; color:var(--ink-faint); font-size:11px;}

  /* ---------- shortcuts ---------- */
  .shortcuts{padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .shortcut{
    display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface-2);
    border-radius:999px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-dim);
  }
  .shortcut .dot{width:7px;height:7px;border-radius:999px;}
  .shortcut:hover{border-color:var(--ink-faint);}
  .shortcut.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .shortcut .n{font-weight:800;}
  .shortcuts-meta{margin-left:auto; font-size:11px; color:var(--ink-faint);}

  /* ---------- KPI row ---------- */
  .kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border-soft); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);}
  .kpi{background:var(--surface); padding:14px 16px; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .kpi .k-label{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint);}
  .kpi .k-value{font-family:'Sora',sans-serif; font-size:23px; font-weight:700; line-height:1;}
  .kpi .k-sub{font-size:11px; color:var(--ink-faint);}
  .kpi.impedido .k-value{color:var(--good);}
  .kpi.recuperado .k-value{color:var(--accent);}
  .kpi.perdido .k-value{color:var(--bad);}
  .kpi-bars{display:flex; flex-direction:column; gap:4px; margin-top:2px;}
  .kpi-bar-row{display:flex; align-items:center; gap:6px; font-size:10.5px;}
  .kpi-bar-row .lbl{width:66px; flex:none; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kpi-bar-track{display:block; flex:1; height:5px; background:var(--surface-3); border-radius:4px; overflow:hidden;}
  .kpi-bar-fill{display:block; height:100%; border-radius:4px; background:var(--accent);}
  .kpi-bar-row .pct{width:32px; flex:none; text-align:right; font-weight:700; color:var(--ink);}
  .kpis{grid-template-columns:repeat(6,1fr);}
  @media (max-width:1180px){ .kpis{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:680px){ .kpis{grid-template-columns:repeat(2,1fr);} }

  /* ---- Dashboard v2 ---- */
  .dash-wrap{display:flex; flex-direction:column; gap:14px;}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .dash-grid.cols-2{grid-template-columns:1.3fr 1fr;}
  @media (max-width:1180px){ .dash-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:760px){ .dash-grid, .dash-grid.cols-2{grid-template-columns:1fr;} }
  .dash-card{padding:16px;}
  .dash-card h3{font-size:11.5px; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--border-soft); text-transform:uppercase; letter-spacing:.5px; font-weight:800; color:var(--ink);}
  .dash-h3-export{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; border-radius:6px 6px 0 0; transition:background .12s;}
  .dash-h3-export:hover{background:var(--surface-2);}
  .dash-h3-export:hover .dash-export-btn{opacity:1;}
  .dash-export-btn{flex:none; font-size:10px; font-weight:700; text-transform:none; letter-spacing:0; color:var(--accent); background:var(--surface-2); border:1px solid var(--border-soft); border-radius:6px; padding:3px 7px; cursor:pointer; opacity:.75; pointer-events:none;}
  .dash-card .sub-note{font-size:11px; color:var(--ink-faint); margin-bottom:10px;}
  .donut-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .donut{width:118px; height:118px; border-radius:50%; flex:none; position:relative;}
  .donut::after{content:""; position:absolute; inset:16px; border-radius:50%; background:var(--surface);}
  .donut-legend{flex:1; min-width:180px; display:flex; flex-direction:column; gap:6px;}
  .donut-legend-row{display:flex; align-items:center; gap:7px; font-size:12px;}
  .donut-legend-row i{width:9px; height:9px; border-radius:2px; flex:none;}
  .donut-legend-row .dl-label{flex:1; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .donut-legend-row .dl-val{font-weight:700; color:var(--ink);}
  .donut-legend-row .dl-pct{width:38px; text-align:right; color:var(--ink-faint); font-size:11px;}
  .hbar-list{display:flex; flex-direction:column; gap:7px; max-height:260px; overflow-y:auto; padding-right:2px;}
  .hbar-row{display:grid; grid-template-columns:1fr 2fr auto; align-items:center; gap:8px; font-size:11.5px;}
  .hbar-row .hb-label{color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hbar-track{display:block; height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden;}
  .hbar-fill{display:block; height:100%; border-radius:4px; background:var(--accent);}
  .hbar-row .hb-val{font-weight:700; color:var(--ink); text-align:right; white-space:nowrap;}
  .dash-callout{margin-top:10px; padding:9px 11px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); font-size:12px; color:var(--ink-dim);}
  .dash-callout b{color:var(--ink);}
  .uf-map-wrap{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start;}
  @media (max-width:760px){ .uf-map-wrap{grid-template-columns:1fr;} }
  .uf-map-wrap svg path{stroke:var(--surface); stroke-width:1.2; cursor:default; transition:opacity .15s;}
  .uf-map-wrap svg path:hover{opacity:.75;}
  .uf-map-wrap svg text{font-size:9px; fill:var(--ink); pointer-events:none; font-weight:700;}
  .heat-legend{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--ink-faint); margin-top:8px;}
  .heat-legend .bar{flex:1; height:8px; border-radius:4px; background:linear-gradient(90deg,#3b7fd9,#e08a1f,#c0392b);}
  .top-uf-list{display:flex; flex-direction:column; gap:6px;}
  .top-uf-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .top-uf-row .rank{width:18px; flex:none; color:var(--ink-faint); font-weight:700; font-size:11px;}
  .top-uf-row .uf-swatch{width:10px; height:10px; border-radius:2px; flex:none;}
  .top-uf-row .uf-name{flex:1; color:var(--ink-dim);}
  .top-uf-row .uf-count{font-weight:700; color:var(--ink);}
  .trend-up{color:var(--good); font-weight:700;}
  .trend-down{color:var(--bad); font-weight:700;}
  .trend-flat{color:var(--ink-faint); font-weight:700;}
  .stat-mini-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:4px;}
  .stat-mini{padding:10px 14px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); min-width:150px;}
  .stat-mini .sm-label{font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint); font-weight:700;}
  .stat-mini .sm-value{font-family:'Sora',sans-serif; font-size:19px; font-weight:700; margin-top:2px;}
  .donut.pie::after{content:none;}
  .therm-row{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .therm-info{flex:1; min-width:190px;}
  .therm-dominant b{font-family:'Sora',sans-serif; font-size:19px; letter-spacing:.3px;}
  .therm-desc{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .therm-total{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .uf-panel .uf-map-svg-col{max-width:230px; margin:0 auto;}

  /* ---- Agenda de Ligações ---- */
  .agd-layout{display:grid; grid-template-columns:290px 1fr; gap:16px; align-items:start;}
  @media (max-width:920px){ .agd-layout{grid-template-columns:1fr;} }
  .agd-panel{padding:16px;}
  .agd-panel + .agd-panel{margin-top:14px;}
  .agd-h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:800; color:var(--ink-faint); margin:0 0 10px;}
  .agd-today-count{font-family:'Sora',sans-serif; font-size:32px; font-weight:700; line-height:1;}
  .agd-today-cap{color:var(--ink-dim); font-size:12.5px; margin-top:4px;}
  .agd-overdue-flag{margin-top:8px; font-size:12px; font-weight:700; color:var(--bad); background:var(--bad-soft); border-radius:8px; padding:6px 9px; cursor:pointer;}
  .agd-next-call{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--accent-soft); display:flex; flex-direction:column; gap:2px; cursor:pointer;}
  .agd-next-call .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); font-weight:700;}
  .agd-next-call .nm{font-weight:700; font-size:13.5px; margin-top:2px; color:var(--ink);}
  .agd-next-call .wh{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim);}
  .agd-empty{color:var(--ink-faint); font-size:12.5px; padding:4px 2px;}
  .agd-upcoming-list{display:flex; flex-direction:column; gap:7px; max-height:320px; overflow-y:auto; padding-right:2px;}
  .agd-upcoming-item{display:flex; gap:9px; align-items:flex-start; padding:8px 9px; border-radius:9px; border:1px solid var(--border); cursor:pointer; transition:background .12s;}
  .agd-upcoming-item:hover{background:var(--surface-2);}
  .agd-upcoming-item.overdue{border-color:var(--bad); background:var(--bad-soft);}
  .agd-upcoming-item .dchip{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; background:var(--surface-3); border-radius:6px; padding:3px 6px; white-space:nowrap; flex:none; text-align:center; min-width:42px;}
  .agd-upcoming-item.overdue .dchip{background:var(--bad); color:#fff;}
  .agd-upcoming-item .info{min-width:0;}
  .agd-upcoming-item .nm{font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agd-upcoming-item .mt{font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agd-cal-card{padding:0; overflow:hidden;}
  .agd-cal-head{display:flex; align-items:center; gap:10px; padding:14px 16px 0; flex-wrap:wrap;}
  .agd-cal-head .agd-month-label{font-size:16px; font-weight:700; font-family:'Sora',sans-serif;}
  .agd-nav-btns{display:flex; gap:4px;}

function buildPeriodoDateOptions(){
  const out = [];
  const start = new Date(2026,8,1); // 01/09/2026
  const end = new Date(2027,11,31); // 31/12/2027
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    out.push({key: iso, label: d.toLocaleDateString("pt-BR")});
  }
  return out;
}

function stripAccents(s){ return (s||"").normalize("NFD").replace(/\p{Diacritic}/gu,""); }
function norm(s){ return stripAccents(String(s||"")).toLowerCase().trim(); }
function todayLocal(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseISODate(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); if(!y) return null; return new Date(y,(m||1)-1,d||1); }
function fmtDate(s){ const d=parseISODate(s); if(!d) return "—"; return d.toLocaleDateString("pt-BR"); }
// Formata um Date local (sem passar por UTC, ao contrário de toISOString) como
// "AAAA-MM-DD" — usado pela Agenda de Ligações para casar com o formato de
// dtUltimoContato/dtProximoContato dos leads.
function isoDateLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtMoney(v){ v=Number(v||0); return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
function fmtMonthKey(mk){ if(!mk) return "—"; const [y,m]=mk.split("-").map(Number); return MONTH_NAMES[m-1]+"/"+y; }
function daysBetween(a,b){ return Math.round((a-b)/86400000); }
function daysUntil(dtISO){ const d=parseISODate(dtISO); if(!d) return null; return daysBetween(d, todayLocal()); }
function nowISO(){ return new Date().toISOString(); }
function uid(){ return Math.random().toString(36).slice(2,10); }
// Padroniza o histórico de movimentação/observações: sempre as 5 entradas mais recentes.
const HIST_MAX = 5;
function pushHist(lead, text){
  lead.hist = [{d: nowISO(), t: text}].concat(lead.hist||[]).slice(0, HIST_MAX);
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function startOfWeek(d){ const day=(d.getDay()+6)%7; const s=new Date(d); s.setDate(d.getDate()-day); s.setHours(0,0,0,0); return s; }
function endOfWeekFn(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999); return e; }
function upcomingFriday(d){ const dow=d.getDay(); const add=(5-dow+7)%7; const f=new Date(d); f.setDate(d.getDate()+add); f.setHours(23,59,59,999); return f; }

const LOCAL_KEY = "dellamed_pipeline_v1";
function localLoad(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); }catch(e){ return {}; } }
function localSave(data){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }catch(e){} }
// The `db` capability freezes every snapshot/data() it returns (by design —
// see db.d.ts: "don't mutate or accumulate them, clone a body before editing
// it"). Every read below hands the result straight to app code that DOES
// mutate leads in place (stage moves, manual edits, auto-transition to
// Inativo...), so every value coming out of dbNS is deep-cloned into a plain,
// writable object here. Without this, any direct mutation throws
// "Cannot assign to read only property" and silently aborts the load/render.
function cloneDeep(v){ return v==null ? v : JSON.parse(JSON.stringify(v)); }

// Abstraction over db capability with a localStorage fallback so the page
// still works (single-viewer, this-browser-only) if db isn't granted.
const Store = {
  async listMonths(){
    if(dbNS){
      const snap = await dbNS.collection("months").get();
      return snap.docs.map(d=>cloneDeep(d.data()));
    }
    const local = localLoad();
    return Object.values(local.months||{});
  },
  async getMeta(monthKey){
    if(dbNS){
      const snap = await dbNS.doc("months/"+monthKey).get();
      return snap.exists ? cloneDeep(snap.data()) : null;
    }
    const local = localLoad();
    return (local.months||{})[monthKey] || null;
  },
  async setMeta(monthKey, meta){
    if(dbNS){
      await dbNS.doc("months/"+monthKey).set(meta);
    }else{
      const local = localLoad(); local.months = local.months || {}; local.months[monthKey] = meta; localSave(local);
    }
  },
  async getChunk(monthKey, ci){
    if(dbNS){
      const snap = await dbNS.doc("months/"+monthKey+"/chunks/c"+ci).get();
      return snap.exists ? cloneDeep(snap.data()) : {leads:[]};
    }
    const local = localLoad();
    return ((local.chunks||{})[monthKey]||{})[ci] || {leads:[]};
  },
  async setChunk(monthKey, ci, data){
    if(dbNS){
      await dbNS.doc("months/"+monthKey+"/chunks/c"+ci).set(data);
    }else{
      const local = localLoad();
      local.chunks = local.chunks || {}; local.chunks[monthKey] = local.chunks[monthKey] || {};
      local.chunks[monthKey][ci] = data; localSave(local);
    }
  },
  async loadMonthLeads(monthKey){
    const meta = await Store.getMeta(monthKey);
    if(!meta) return {meta:null, leads:[]};
    const leads = [];
    for(let i=0;i<meta.chunkCount;i++){
      const c = await Store.getChunk(monthKey, i);
      leads.push(...(c.leads||[]));
    }
    return {meta, leads};
  },
  async setAttachment(id, data){
    if(dbNS){
      await dbNS.doc("attachments/"+id).set(data);
    }else{
      const local = localLoad(); local.attachments = local.attachments || {}; local.attachments[id] = data; localSave(local);
    }
  },
  async getAttachment(id){
    if(dbNS){
      const snap = await dbNS.doc("attachments/"+id).get();
      return snap.exists ? cloneDeep(snap.data()) : null;
    }
    const local = localLoad();
    return (local.attachments||{})[id] || null;
  }
};

// Recompute a lead's derived status/stage given fresh raw data pulled from an import.
// Preserves manual fields (acao, time, vendedor, ofensor, notes, and any stage the
// sales team already progressed beyond the automatic states).
// Vendedor is derived from whichever of these ERP columns is filled, in this
// priority order (per the retention playbook): Vendedor Interno (VE), Key
// Account (Z3), Prospect (Z5), then Representante (Z1). Time is then looked up
// from that vendedor name via TEAM_MAP.
function deriveVendedor(fresh){
  // Priority order per the retention playbook: Vendedor Interno (VE) → Key
  // Account (Z3) → Prospect (Z5) → Representante (Z1) → Sucesso do Cliente
  // (Z6) as a last resort, since a client is sometimes only tagged there.
  return fresh.vendInt || fresh.keyAcc || fresh.prospect || fresh.rep || fresh.sucCli || null;
}
function applyImportToLead(existing, fresh, monthKey){
  const now = nowISO();
  if(!existing){
    const derivedVendedor = deriveVendedor(fresh);
    const derivedTime = lookupTeam(derivedVendedor);
    return Object.assign({}, fresh, {
      stage: "inativam",
      status: "pendente",
      acao: null, time: derivedTime, vendedor: derivedVendedor, vendedorAuto: true, ofensor: null, ofensorDetalhe: null, notes: "",
      dtUltimoContato: null, dtProximoContato: null, horaProximoContato: null, valorProposta: null, linhasPositivadas: [],
      contatoDecisor: null, whatsapp: null, whatsappIndisponivel: false,
      baselineUltFat: fresh.dtUltFat,
      monthKey, createdAt: now, lastTouched: now, dataUpdatedAt: now,
      hist: [{d:now, t:"Importado"}]
    });
  }
  const derivedVendedor = deriveVendedor(fresh);
  const derivedTime = lookupTeam(derivedVendedor);
  // Only refresh Time/Vendedor automatically when they were auto-derived (or
  // never set) — a manual choice by the sales team is never overwritten by a
  // later import.
  const keepAuto = existing.vendedorAuto !== false;
  const merged = Object.assign({}, existing, fresh, {
    acao: existing.acao,
    time: keepAuto ? (derivedTime || existing.time) : existing.time,
    vendedor: keepAuto ? (derivedVendedor || existing.vendedor) : existing.vendedor,
    vendedorAuto: keepAuto,
    ofensor: existing.ofensor, ofensorDetalhe: existing.ofensorDetalhe || null,
    notes: existing.notes, baselineUltFat: existing.baselineUltFat,
    dtUltimoContato: existing.dtUltimoContato || null, dtProximoContato: existing.dtProximoContato || null,
    horaProximoContato: existing.horaProximoContato || null,
    valorProposta: existing.valorProposta || null, linhasPositivadas: existing.linhasPositivadas || [],
    contatoDecisor: existing.contatoDecisor || null, whatsapp: existing.whatsapp || null,
    whatsappIndisponivel: existing.whatsappIndisponivel || false,
    monthKey, createdAt: existing.createdAt, lastTouched: existing.lastTouched,
    dataUpdatedAt: now, stage: existing.stage
  });
  const computed = computeStatusStage(merged);
  merged.status = computed.status;
  merged.stage = computed.stage;
  merged.hist = existing.hist || [];
  pushHist(merged, "Atualizado via importação (status: "+STATUS_LABEL[computed.status]+")");
  return merged;
}

// Core rule: compare fresh invoice date against the inactivation date to decide
// impedido / recuperado / perdido, per the definitions given for the pipeline.
function computeStatusStage(lead){
  let status = lead.status || "pendente";
  let stage = lead.stage || "inativam";
  if(lead.statusErp === "Inativo"){
    return {status:"perdido", stage:"inativo"};
  }
  const baseline = parseISODate(lead.baselineUltFat);
  const fresh = parseISODate(lead.dtUltFat);
  const inat = parseISODate(lead.dtInat);
  const monthEnd = inat ? new Date(inat.getFullYear(), inat.getMonth()+1, 0, 23,59,59,999) : null;
  if(fresh && baseline && fresh.getTime() > baseline.getTime()){
    if(inat && fresh.getTime() <= inat.getTime()){
      status = "impedido"; stage = (stage==="inativo") ? stage : "ganho";
    }else if(inat && monthEnd && fresh.getTime() <= monthEnd.getTime() && fresh.getMonth()===inat.getMonth() && fresh.getFullYear()===inat.getFullYear()){
      status = "recuperado"; stage = (stage==="inativo") ? stage : "ganho";
    }else{
      status = "perdido"; stage = (stage==="inativo") ? stage : "perdido";
    }
  }else if(monthEnd && todayLocal().getTime() > monthEnd.getTime() && status==="pendente"){
    status = "perdido"; stage = (stage==="inativo") ? stage : "perdido";
  }
  return {status, stage};
}

// Classificação por estágio da negociação (não mais por prazo até a
// inativação): Negociando = quente, Proposta enviada = morno, Negociação
// Perdida = frio.
function temperature(lead){
  if(lead.stage==="negociando") return "quente";
  if(lead.stage==="proposta") return "morno";
  if(lead.stage==="perdido") return "frio";
  return null;
}

const TEMP_LABEL = {quente:"Quente", morno:"Morno", frio:"Frio"};

// Which extra fields must be filled before a stage move is allowed to commit.
// "obs" (a fresh observation) is required on every move, per the rule that the
// history must show what happened at every movement.
function requiredFieldsForMove(fromStage, toStage){
  const req = ["obs"];
  // Sempre que o lead sai de "Inativam no mês" ou "Inativado" para qualquer
  // outro estágio, o CRM (resumo do contato), as datas de último/próximo
  // contato (com horário do próximo) e os dados do decisor (nome + WhatsApp)
  // precisam ser registrados. Todo "dtProximoContato" exigido também exige o
  // horário correspondente (horaProximoContato) — os dois andam juntos.
  const leavingInativo = (fromStage==="inativam" || fromStage==="inativo");
  if(leavingInativo){
    req.push("dtUltimoContato","dtProximoContato","horaProximoContato","contatoDecisor","whatsapp");
  }
  if(toStage==="contato"){
    req.push("dtUltimoContato","dtProximoContato","horaProximoContato");
  }else if(toStage==="proposta"){
    req.push("valorProposta","linhasPositivadas");
    if(fromStage==="inativam") req.push("dtUltimoContato","dtProximoContato","horaProximoContato");
  }else if(toStage==="negociando"){
    req.push("valorProposta","linhasPositivadas");
    if(fromStage==="inativam") req.push("dtUltimoContato","dtProximoContato","horaProximoContato");
  }else if(toStage==="perdido"){
    req.push("dtUltimoContato","dtProximoContato","horaProximoContato","ofensor");
  }
  return Array.from(new Set(req));
}

function isStale(lead){
  if(["ganho","perdido","inativo"].includes(lead.stage)) return false;
  const t = lead.lastTouched ? new Date(lead.lastTouched) : null;
  if(!t) return false;
  return daysBetween(new Date(), t) >= 7;
}

/* ---- shortcut predicates ---- */
const SHORTCUTS = [
  {key:"hoje", label:"Inativam hoje", dot:"var(--bad)", test:(l)=>{
    const d=parseISODate(l.dtInat); if(!d) return false; const t=todayLocal();
    return d.getTime()===t.getTime();
  }},
  {key:"semana_passada", label:"Já inativaram na semana", dot:"var(--ink-faint)", test:(l)=>{
    const d=parseISODate(l.dtInat); if(!d) return false; const t=todayLocal();
    return d.getTime() >= startOfWeek(new Date()).getTime() && d.getTime() <= t.getTime();
  }},
  {key:"ate_sexta", label:"Vão inativar até sexta", dot:"var(--warn)", test:(l)=>{
    const d=parseISODate(l.dtInat); if(!d) return false; const t=todayLocal(); const f=upcomingFriday(new Date());
    return l.status==="pendente" && d.getTime()>=t.getTime() && d.getTime()<=f.getTime();
  }},
  {key:"sem_att", label:"Sem atualização 7d+", dot:"var(--ink-faint)", test:(l)=> isStale(l)},
  {key:"quente", label:"Leads quentes", dot:"var(--bad)", test:(l)=> temperature(l)==="quente"},
  {key:"morno", label:"Leads mornos", dot:"var(--warn)", test:(l)=> temperature(l)==="morno"},

/* ============================= FILTERING ============================= */
// skipShortcut lets the shortcut chips themselves count against every other
// active filter (period, ação, time, vendedor, status, segmento, UF, ofensor,
// busca) without also being narrowed by whichever shortcut happens to be
// selected right now — otherwise every chip's count would collapse to
// whatever the currently-active chip matches instead of showing what each
// option would yield if clicked.
function matchesFilters(l, skipShortcut){
  const f = state.filters;
  if(f.periodo.size && !f.periodo.has(l.dtInat)) return false;
  if(f.acao.size && !f.acao.has(l.acao||"—")) return false;
  if(f.time.size && !f.time.has(l.time||"—")) return false;
  if(f.vendedor.size && !f.vendedor.has(l.vendedor||"—")) return false;
  if(f.status.size && !f.status.has(l.status)) return false;
  if(f.seg.size && !f.seg.has(l.seg||"—")) return false;
  if(f.uf.size && !f.uf.has(l.uf||"—")) return false;
  if(f.ofensor.size && !f.ofensor.has(l.ofensor||"—")) return false;
  // Seleção em massa (lupa de pesquisa por Cód Cliente): quando há alguma
  // seleção ativa, o quadro mostra só os clientes selecionados.
  if(state.bulkSelected && state.bulkSelected.size && !state.bulkSelected.has(l.cod)) return false;
  if(!skipShortcut && state.shortcut){
    const sc = SHORTCUTS.find(s=>s.key===state.shortcut);
    if(sc && !sc.test(l)) return false;
  }
  if(state.search){
    const q = norm(state.search);
    const hay = norm((l.cod||"")+" "+(l.cnpj||"")+" "+(l.cli||""));
    if(!hay.includes(q)) return false;
  }
  return true;
}
function currentFiltered(){ return state.leads.filter(l=>matchesFilters(l, false)); }
// Leads honoring every active filter/search, but not the shortcut selection
// itself — the base set the shortcut chip counters are computed against.
function leadsForShortcutCounts(){ return state.leads.filter(l=>matchesFilters(l, true)); }

let dragSelect = null; // {mode, key, active, options, colorFn, placeholder} while a drag-select is in progress
function openMultiPopover(anchor, key, options, colorFn, searchPlaceholder){
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.id = "activePopover";
  const active = state.filters[key];
  const counts = {};
  state.leads.forEach(l=>{
    let v;
    if(key==="periodo") v = l.dtInat;
    else if(key==="status") v = l.status;
    else if(key==="acao") v = l.acao||"—";
    else if(key==="time") v = l.time||"—";
    else if(key==="vendedor") v = l.vendedor||"—";
    else if(key==="seg") v = l.seg||"—";
    else if(key==="uf") v = l.uf||"—";
    else if(key==="ofensor") v = l.ofensor||"—";
    counts[v] = (counts[v]||0)+1;
  });
  const searchable = options.length > 3;
  pop.innerHTML =
    (searchable ? `<input type="text" class="form-input" id="popSearch" placeholder="${escapeHtml(searchPlaceholder||"Buscar por nome...")}" style="margin-bottom:6px;">` : "") +
    `<div id="popList" style="user-select:none;">` + options.map(opt=>{
      const val = typeof opt==="object" ? opt.key : opt;
      const lbl = typeof opt==="object" ? opt.label : opt;
      const checked = active.has(val) ? "checked" : "";
      const dot = colorFn ? `<span class="tag-dot" style="background:${colorFn(val)}"></span>` : "";
      const n = counts[val]||0;
      return `<div class="popover-item" data-val="${escapeHtml(val)}" data-search="${escapeHtml(norm(lbl))}"><input type="checkbox" style="pointer-events:none;" ${checked}>${dot}<span>${escapeHtml(lbl)}</span><span class="n">${n}</span></div>`;
    }).join("") + `</div>`;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const maxLeft = window.innerWidth - Math.min(pop.offsetWidth || 260, window.innerWidth-16);
  pop.style.left = Math.max(8, Math.min(r.left, maxLeft)) + "px";
  pop.style.top = (r.bottom+6) + "px";

  function refreshAfterDrag(){
    renderAll();
    const btn = document.querySelector(`[data-filterkey="${key}"]`);
    if(btn) openMultiPopover(btn, key, options, colorFn, searchPlaceholder);
  }
  function onDragEnd(){
    document.removeEventListener("mouseup", onDragEnd);
    if(dragSelect){ dragSelect = null; refreshAfterDrag(); }
  }
  // Click-and-drag multi-select: mousedown on an item starts a drag whose
  // "paint mode" (checking vs unchecking) is set by that first item; dragging
  // over other items (mouse held down) applies the same mode to each.
  pop.querySelectorAll(".popover-item").forEach(item=>{
    const val = item.getAttribute("data-val");
    const cb = item.querySelector("input[type=checkbox]");
    item.addEventListener("mousedown", (e)=>{
      e.preventDefault();
      const mode = !cb.checked;
      cb.checked = mode;
      if(mode) active.add(val); else active.delete(val);
      dragSelect = {mode};
      document.addEventListener("mouseup", onDragEnd);
    });
    item.addEventListener("mouseenter", ()=>{
      if(!dragSelect) return;
      cb.checked = dragSelect.mode;
      if(dragSelect.mode) active.add(val); else active.delete(val);
    });
    // Prevent the click that follows mousedown/mouseup from bubbling to the
    // document-level outsideClosePopover listener. Without this, a plain
    // click (mousedown+mouseup with no drag) rebuilds the popover *before*
    // the click event fires; the click's target is then a detached node from
    // the old (already-removed) popover, which outsideClosePopover fails to
    // recognize as "inside", closing the freshly-reopened popover instantly.
    item.addEventListener("click", (e)=>{ e.stopPropagation(); });
  });
  const searchInput = document.getElementById("popSearch");
  if(searchInput){
    searchInput.addEventListener("mousedown", e=>e.stopPropagation());
    searchInput.addEventListener("click", e=>e.stopPropagation());
    searchInput.addEventListener("input", ()=>{
      const q = norm(searchInput.value);
      pop.querySelectorAll(".popover-item").forEach(item=>{
        item.style.display = item.getAttribute("data-search").includes(q) ? "" : "none";
      });
    });
    setTimeout(()=>searchInput.focus(), 0);
  }
  setTimeout(()=>document.addEventListener("click", outsideClosePopover, {once:false}), 0);
}
function outsideClosePopover(e){
  const pop = document.getElementById("activePopover");
  if(!pop) return;
  if(pop.contains(e.target) || e.target.closest("[data-filterkey]")) return;
  closePopover();
}
function closePopover(){
  const pop = document.getElementById("activePopover");
  if(pop) pop.remove();
  document.removeEventListener("click", outsideClosePopover);
}

// The "Mês (base)" selector always offers every month of the tracked window
// (Setembro/2026 through Dezembro/2027), whether or not that month has data
// yet imported — so the whole planning horizon is visible from day one,
// instead of only appearing once a file for that month has been imported.
function buildAllMonthOptions(){
  const out = [];
  let [y,m] = TRACKING_START.split("-").map(Number);
  const [endY,endM] = [2027,12];
  while(y<endY || (y===endY && m<=endM)){
    out.push(y+"-"+String(m).padStart(2,"0"));
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
const ALL_MONTH_OPTIONS = buildAllMonthOptions();
function getAllMonthOptions(){
  const set = new Set(ALL_MONTH_OPTIONS);
  // still fold in anything already imported/selected outside that window, just in case
  state.months.forEach(m=>{ if(m.monthKey>=TRACKING_START) set.add(m.monthKey); });
  if(state.monthKey>=TRACKING_START) set.add(state.monthKey);
  return Array.from(set).sort();
}

function pct(n,d){ return d? Math.round(n/d*100) : 0; }

function heatColor(t){
  t = Math.max(0, Math.min(1, t));
  const stops = [[59,127,217],[224,138,31],[192,57,43]]; // azul -> laranja -> vermelho
  const seg = t<0.5 ? 0 : 1;
  const lt = t<0.5 ? t/0.5 : (t-0.5)/0.5;
  const c0=stops[seg], c1=stops[seg+1];
  const r=Math.round(c0[0]+(c1[0]-c0[0])*lt), g=Math.round(c0[1]+(c1[1]-c0[1])*lt), b=Math.round(c0[2]+(c1[2]-c0[2])*lt);
  return `rgb(${r},${g},${b})`;
}

function donutHtml(segments, opts){
  opts = opts || {};
  const total = segments.reduce((s,x)=>s+x.count,0);
  let acc = 0;
  const parts = segments.map(seg=>{
    const start = total? acc/total*360 : 0;
    acc += seg.count;
    const end = total? acc/total*360 : 0;
    return `${seg.color} ${start}deg ${end}deg`;
  });
  const bg = total ? parts.join(", ") : "var(--surface-3) 0deg 360deg";
  const legend = segments.map(seg=>`
    <div class="donut-legend-row"${seg.drillKey?` data-drill="${escapeHtml(seg.drillKey)}" style="cursor:pointer;"`:""}>
      <i style="background:${seg.color}"></i>
      <span class="dl-label" title="${escapeHtml(seg.label)}">${escapeHtml(seg.label)}</span>
      <span class="dl-val">${seg.count}</span>
      <span class="dl-pct">${pct(seg.count,total)}%</span>
    </div>`).join("");
  return `
    <div class="donut-row">
      <div class="donut${opts.pie?" pie":""}" style="background:conic-gradient(${bg});"></div>
      <div class="donut-legend">${legend}</div>
    </div>`;
}

function thermometerHtml(segments){
  const total = segments.reduce((s,x)=>s+x.count,0);
  const dominant = segments.slice().sort((a,b)=>b.count-a.count)[0] || {label:"—", count:0, color:"var(--ink-faint)"};
  const fillRatio = total ? dominant.count/total : 0;
  const descMap = {
    Frio:"Baixa intenção de compra.",
    Morno:"Já interage e pesquisa, mas precisa ser nutrido.",
    Quente:"Intenção clara de compra, próximo de fechar."
  };
  const legend = segments.map(seg=>`
    <div class="donut-legend-row"${seg.drillKey?` data-drill="${escapeHtml(seg.drillKey)}" style="cursor:pointer;"`:""}>
      <i style="background:${seg.color}"></i>
      <span class="dl-label">${escapeHtml(seg.label)}</span>
      <span class="dl-val">${seg.count}</span>
      <span class="dl-pct">${pct(seg.count,total)}%</span>
    </div>`).join("");

  // Desenhado inteiramente em SVG (em vez de divs empilhadas em flex) para que o
  // tubo, o preenchimento e o bulbo fiquem sempre alinhados entre si, não importa
  // a largura do card — evita o "quebra de layout" que acontecia com flex-wrap.
  const tubeTop=8, tubeBottom=148, tubeH=tubeBottom-tubeTop, tubeX=34, tubeW=22, cx=tubeX+tubeW/2;
  const fillH = Math.max(6, Math.round(tubeH*fillRatio));
  const fillY = tubeBottom - fillH;
  const marks = [100,75,50,25,0];
  const scaleSvg = marks.map((m,i)=>{
    const y = tubeTop + (tubeH/(marks.length-1))*i;
    return `<line x1="${tubeX-10}" y1="${y}" x2="${tubeX-4}" y2="${y}" stroke="var(--border)"></line>
      <text x="${tubeX-14}" y="${y+3}" font-size="9" text-anchor="end" fill="var(--ink-faint)">${m}</text>`;
  }).join("");
  const thermSvg = `
    <svg viewBox="0 0 92 186" style="width:88px; height:180px; flex:none;">
      ${scaleSvg}
      <rect x="${tubeX}" y="${tubeTop}" width="${tubeW}" height="${tubeH}" rx="11" fill="var(--surface-3)" stroke="var(--border-soft)"></rect>
      <rect x="${tubeX}" y="${fillY}" width="${tubeW}" height="${fillH}" rx="11" fill="${dominant.color}"></rect>
      <circle cx="${cx}" cy="${tubeBottom}" r="22" fill="var(--surface)"></circle>
      <circle cx="${cx}" cy="${tubeBottom}" r="17" fill="${dominant.color}"></circle>
    </svg>`;

  return `
    <div class="therm-row">
      ${thermSvg}
      <div class="therm-info">
        <div class="therm-dominant"><b>${escapeHtml(dominant.label.toUpperCase())}</b></div>
        <div class="therm-desc">${escapeHtml(descMap[dominant.label]||"")}</div>
        <div class="therm-total">${dominant.count} leads</div>
        <div class="donut-legend" style="margin-top:10px;">${legend}</div>
      </div>
    </div>`;
}

function hbarListHtml(rows, opts){
  opts = opts || {};
  if(!rows.length) return `<div class="k-sub">Sem dados no período.</div>`;
  const total = opts.total != null ? opts.total : rows.reduce((s,r)=>s+r.count,0);
  const max = Math.max(...rows.map(r=>r.count), 1);
  return `<div class="hbar-list">` + rows.map(r=>`
    <div class="hbar-row"${r.drillKey?` data-drill="${escapeHtml(r.drillKey)}" style="cursor:pointer;"`:""}>
      <span class="hb-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</span>
      <span class="hbar-track"><span class="hbar-fill" style="width:${Math.round(r.count/max*100)}%;"></span></span>
      <span class="hb-val">${r.count}${total? ` (${pct(r.count,total)}%)`:""}</span>
    </div>`).join("") + `</div>`;
}

function statMiniHtml(label, value){
  return `<div class="stat-mini"><div class="sm-label">${escapeHtml(label)}</div><div class="sm-value">${value}</div></div>`;
}

// Cabeçalho clicável reutilizado em cada card do Dashboard: clicar em qualquer
// ponto do cabeçalho (título ou o botão "⬇ Excel") exporta os dados daquele
// gráfico/seção específica. `key` é resolvido contra window.__dashExportConfigs
// (montado a cada renderDashboard()) para achar as linhas a exportar.
function dashCardHeader(title, key){
  return `<h3 class="dash-h3-export" data-dash-export="${key}" title="Clique para exportar esta seção em Excel">
    <span>${escapeHtml(title)}</span>
    <button type="button" class="dash-export-btn" tabindex="-1">⬇ Excel</button>
  </h3>`;
}

async function renderDashboard(){
  const wrap = document.getElementById("viewDashboard");
  wrap.innerHTML = `<div class="panel" style="padding:40px; text-align:center; color:var(--ink-faint);"><span class="spinner"></span> Carregando dashboard...</div>`;
  const list = currentFiltered();
  const total = list.length;

  const filterParts = activeFilterSummary();
  const filterNote = filterParts.length
    ? `<div style="font-size:11px; color:var(--accent); font-weight:600;">Filtros aplicados: ${filterParts.map(escapeHtml).join(" · ")}</div>`
    : "";

  /* ---- KPI row: contagem por estágio + ofensores + temperatura ---- */
  const stageCounts = {};
  STAGES.forEach(s=>{ stageCounts[s.key] = list.filter(l=>l.stage===s.key).length; });
  const tempCounts = {quente:0, morno:0, frio:0};
  list.forEach(l=>{ const t = temperature(l); if(t) tempCounts[t]++; });
  const ofensorCounts = {};
  list.forEach(l=>{ if(l.ofensor) ofensorCounts[l.ofensor] = (ofensorCounts[l.ofensor]||0)+1; });
  let ofensorRows = Object.entries(ofensorCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k, count:v}));
  // Quando nenhum ofensor ainda foi citado no período, lista as opções disponíveis
  // (com 0) em vez de mostrar o painel vazio — assim dá pra ver o que existe.
  const ofensorNoneCited = !ofensorRows.length;
  if(ofensorNoneCited) ofensorRows = OFENSOR_OPTIONS.map(o=>({label:o, count:0}));
  ofensorRows = ofensorRows.map((r,i)=>({...r, drillKey:`ofensor-${i}`}));
  const ofensorTotal = ofensorRows.reduce((s,r)=>s+r.count,0);

  function kpiTile(label, value, sub){
    return `<div class="kpi"><div class="k-label">${escapeHtml(label)}</div><div class="k-value num">${value}</div><div class="k-sub">${sub}</div></div>`;
  }

  /* ---- Atualização por vendedor: quem mais preencheu informações de CRM
     (resumo de contato, data do último contato, decisor ou WhatsApp) nos leads
     sob sua responsabilidade, dentro do período/filtros atuais. ---- */
  const vendorUpdateMap = {};
  list.forEach(l=>{
    const hasCrmInfo = !!(l.notes || l.dtUltimoContato || l.contatoDecisor || l.whatsapp || l.whatsappIndisponivel);
    const vendedorKey = l.vendedor || "(sem vendedor)";
    if(!vendorUpdateMap[vendedorKey]) vendorUpdateMap[vendedorKey] = {vendedor: vendedorKey, time: l.time || lookupTeam(l.vendedor) || "(sem time)", total: 0, atualizados: 0};
    vendorUpdateMap[vendedorKey].total++;
    if(hasCrmInfo) vendorUpdateMap[vendedorKey].atualizados++;
  });
  const vendorUpdateRows = Object.values(vendorUpdateMap)
    .filter(r=>r.vendedor!=="(sem vendedor)")
    .sort((a,b)=>b.atualizados-a.atualizados || b.total-a.total);
  const topVendor = vendorUpdateRows[0] || null;
  const vendorUpdateSub = topVendor
    ? `${escapeHtml(topVendor.vendedor)} (${escapeHtml(topVendor.time)}) — ${topVendor.atualizados} lead(s) com CRM preenchido`
    : "Nenhuma atualização de CRM registrada no período.";

  const stageOrder = ["inativam","inativo","contato","proposta","negociando","ganho","perdido"];
  const kpiTilesHtml = stageOrder.map(key=>{
    const stage = STAGES.find(s=>s.key===key);
    const c = stageCounts[key]||0;
    return kpiTile(stage.label, c, `${pct(c,total)}% dos leads do período`);
  }).join("") + `
    <div class="kpi">
      <div class="k-label">Ofensores</div>
      <div class="k-value num">${ofensorTotal}</div>
      ${hbarListHtml(ofensorRows.slice(0,4), {total:ofensorTotal})}
    </div>
    ${kpiTile("Frios", tempCounts.frio, `${pct(tempCounts.frio,total)}% dos leads do período`)}
    ${kpiTile("Mornos", tempCounts.morno, `${pct(tempCounts.morno,total)}% dos leads do período`)}
    ${kpiTile("Quentes", tempCounts.quente, `${pct(tempCounts.quente,total)}% dos leads do período`)}
    <div class="kpi" id="kpiVendorUpdates" style="cursor:pointer;" title="Clique para ver o ranking completo por vendedor">
      <div class="k-label">Atualização por vendedor</div>
      <div class="k-value num">${topVendor ? topVendor.atualizados : 0}</div>
      <div class="k-sub">${vendorUpdateSub}</div>
    </div>
  `;

  /* ---- Leads por status (pizza) ---- */
  const statusDonutMap = [
    ["inativo","Inativado"], ["contato","Contato feito"], ["proposta","Proposta enviada"],
    ["negociando","Negociando"], ["ganho","Ganho"], ["perdido","Negociação Perdida"]
  ];
  const statusSegs = statusDonutMap.map(([key,label])=>{
    const stage = STAGES.find(s=>s.key===key);
    return {label, count: stageCounts[key]||0, color: stage.color, drillKey:`status-${key}`};
  });

  /* ---- Temperatura dos leads ---- */
  const tempSegs = [
    {label:"Frio", count:tempCounts.frio, color:TEMP_COLOR.frio, drillKey:"temp-frio"},
    {label:"Morno", count:tempCounts.morno, color:TEMP_COLOR.morno, drillKey:"temp-morno"},
    {label:"Quente", count:tempCounts.quente, color:TEMP_COLOR.quente, drillKey:"temp-quente"}
  ];

  /* ---- Oportunidades por canal (segmento) — todos os segmentos da base ---- */
  const segCounts = {};
  list.forEach(l=>{ const k = l.seg || "(vazio)"; segCounts[k] = (segCounts[k]||0)+1; });
  const segRows = Object.entries(segCounts).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k, count:v, drillKey:`canal-${i}`}));

  /* ---- Por time ---- */
  const timeCounts = {};
  list.forEach(l=>{ const k = l.time || "(vazio)"; timeCounts[k] = (timeCounts[k]||0)+1; });
  const timeRows = Object.entries(timeCounts).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k, count:v, drillKey:`time-${i}`}));

  /* ---- Por linha (+ destaque da linha mais vendida em Ganho) ---- */
  const linhaCounts = {};
  LINHAS_OPTIONS.forEach(l=>{ linhaCounts[l]=0; });
  let semLinha = 0;
  list.forEach(l=>{
    const arr = l.linhasPositivadas||[];
    if(!arr.length){ semLinha++; return; }
    arr.forEach(x=>{ linhaCounts[x] = (linhaCounts[x]||0)+1; });
  });
  const linhaRows = [{label:"(vazio)", count:semLinha}, ...Object.entries(linhaCounts).map(([k,v])=>({label:k, count:v}))]
    .sort((a,b)=> b.count-a.count)
    .map((r,i)=>({...r, drillKey:`linha-${i}`}));
  const ganhoLeads = list.filter(l=>l.stage==="ganho");
  const linhaGanhoCounts = {};
  ganhoLeads.forEach(l=>{ (l.linhasPositivadas||[]).forEach(x=>{ linhaGanhoCounts[x]=(linhaGanhoCounts[x]||0)+1; }); });
  const topLinhaGanho = Object.entries(linhaGanhoCounts).sort((a,b)=>b[1]-a[1])[0];

  /* ---- Oportunidades por UF — mapa de calor de clientes a inativar no mês ---- */
  const ufInativamCounts = {};
  list.forEach(l=>{ if(l.stage==="inativam" && l.uf){ ufInativamCounts[l.uf] = (ufInativamCounts[l.uf]||0)+1; } });
  const maxUf = Math.max(...Object.values(ufInativamCounts), 1);
  const top10Uf = Object.entries(ufInativamCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const top10UfSet = new Set(top10Uf.map(([uf])=>uf));
  const mapPaths = Object.entries(BR_UF_PATHS.states).map(([uf,st])=>{
    const ufUpper = uf.toUpperCase();
    const c = ufInativamCounts[ufUpper] || 0;
    const color = c>0 ? heatColor(c/maxUf) : "var(--surface-3)";
    const isTop = top10UfSet.has(ufUpper);
    return `<path d="${st.d}" fill="${color}" ${isTop?'stroke="var(--ink)" stroke-width="2"':''} data-drill="uf-${ufUpper}" style="cursor:pointer;"><title>${escapeHtml(st.name)} (${ufUpper}): ${c} cliente(s) a inativar no mês</title></path>`;
  }).join("");
  const totalUfInativam = Object.values(ufInativamCounts).reduce((a,b)=>a+b,0);
  const ufExportRows = Object.entries(BR_UF_PATHS.states).map(([uf,st])=>{
    const ufUpper = uf.toUpperCase();
    const c = ufInativamCounts[ufUpper] || 0;
    return {"UF": ufUpper, "Estado": st.name, "Clientes a inativar no mês": c, "% do total": pct(c, totalUfInativam||1), "Top 10": top10UfSet.has(ufUpper) ? "Sim" : "Não"};
  }).sort((a,b)=> b["Clientes a inativar no mês"]-a["Clientes a inativar no mês"]);
  const ufMapHtml = `
    <div class="panel dash-card uf-panel">
      ${dashCardHeader("Oportunidades por UF — mapa de calor", "uf")}
      <div class="sub-note">Concentração de clientes em "Inativam no mês" por estado — azul (menos) → laranja (intermediário) → vermelho (mais). Contorno destacado = Top 10 UFs.</div>
      <div class="uf-map-wrap">
        <div class="uf-map-svg-col">
          <svg viewBox="${BR_UF_PATHS.viewBox}" style="width:100%; height:auto;">${mapPaths}</svg>
          <div class="heat-legend"><span>Menos</span><span class="bar"></span><span>Mais</span></div>
        </div>
        <div>
          <div class="stat-mini" style="margin-bottom:12px;"><div class="sm-label">Clientes a inativar no mês</div><div class="sm-value">${totalUfInativam}</div></div>
          <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint); margin-bottom:8px;">Top 10 UFs</div>
          <div class="top-uf-list">
            ${top10Uf.length ? top10Uf.map(([uf,c],i)=>`
              <div class="top-uf-row" data-drill="uf-${uf}" style="cursor:pointer;">
                <span class="rank">${i+1}º</span>
                <span class="uf-swatch" style="background:${heatColor(c/maxUf)}"></span>
                <span class="uf-name">${uf}</span>
                <span class="uf-count">${c}</span>
              </div>`).join("") : `<div class="k-sub">Nenhum cliente a inativar no período.</div>`}
          </div>
        </div>
      </div>
    </div>`;

  /* ---- Ofensores (ranking, mais → menos citado) ---- */
  const ofensoresPanel = `
    <div class="panel dash-card">
      ${dashCardHeader("Ofensores", "ofensores")}
      <div class="sub-note">${ofensorNoneCited ? "Nenhum ofensor citado no período ainda — opções disponíveis:" : "Ofensores mais citados no período, do mais para o menos citado."}</div>
      ${hbarListHtml(ofensorRows, {total:ofensorTotal})}
    </div>`;

  /* ---- Atualizações por dia da semana + contatos por ligação ---- */
  const WEEKDAY_LABELS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const weekdayCounts = [0,0,0,0,0,0,0];
  list.forEach(l=>{
    const dtStr = l.lastTouched || l.dtUltimoContato;
    if(!dtStr) return;
    const d = new Date(dtStr);
    if(isNaN(d.getTime())) return;
    weekdayCounts[d.getDay()]++;
  });
  const wOrder = [1,2,3,4,5,6,0];
  const maxWd = Math.max(...weekdayCounts, 1);
  const WW=520,WH=180,WPAD=30;
  const wbw = (WW-WPAD*2)/wOrder.length;
  const weekdaySvg = wOrder.map((di,i)=>{
    const v = weekdayCounts[di];
    const h = (WH-WPAD*2) * (v/maxWd);
    const x = WPAD + i*wbw + wbw*0.15;
    const bw2 = wbw*0.7;
    const y = WH-WPAD-h;
    return `<g class="dash-drill-bar" data-drill="weekday-${di}" style="cursor:pointer;">
      <rect x="${WPAD + i*wbw}" y="${WPAD}" width="${wbw}" height="${WH-WPAD*2}" fill="transparent"></rect>
      <rect x="${x}" y="${y}" width="${bw2}" height="${h}" fill="var(--accent)" rx="3"></rect>
      <text x="${x+bw2/2}" y="${WH-WPAD+14}" font-size="9" text-anchor="middle" fill="var(--ink-faint)">${WEEKDAY_LABELS[di].slice(0,3)}</text>
      <text x="${x+bw2/2}" y="${Math.max(y-4,10)}" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${v}</text>
    </g>`;
  }).join("");
  const ligacaoCount = list.filter(l=> l.ofensorDetalhe && Array.isArray(l.ofensorDetalhe.meiosTentados) && l.ofensorDetalhe.meiosTentados.includes("Ligação")).length;
  const weekdayExportRows = wOrder.map(di=>({"Dia da semana": WEEKDAY_LABELS[di], "Atualizações": weekdayCounts[di]}));
  const weekdayPanel = `
    <div class="panel dash-card">
      ${dashCardHeader("Atualizações por dia da semana", "weekday")}
      <div class="sub-note">Baseado na última atualização registrada em cada lead.</div>
      <svg viewBox="0 0 ${WW} ${WH}" style="width:100%; height:auto;">
        <line x1="${WPAD}" y1="${WH-WPAD}" x2="${WW-WPAD}" y2="${WH-WPAD}" stroke="var(--border)"></line>
        ${weekdaySvg}
      </svg>
      <div class="stat-mini-row">${statMiniHtml("Contatos por Ligação", ligacaoCount)}</div>
    </div>`;

  /* ---- Evolução das reversões (R$), mês a mês ---- */
  const monthsMeta = await Store.listMonths();
  const sortedMonths = monthsMeta.filter(m=>m.monthKey>=TRACKING_START).sort((a,b)=>a.monthKey.localeCompare(b.monthKey));
  const reversaoRows = [];
  for(const m of sortedMonths){
    const {leads} = await ensureMonthLoaded(m.monthKey);
    const filtered = leads.filter(l=>matchesFilters(l, false));
    const revertedLeads = filtered.filter(l=>["impedido","recuperado"].includes(l.status));
    const valor = revertedLeads.reduce((s,l)=>s+(Number(l.fatCom)||0),0);
    reversaoRows.push({mk:m.monthKey, valor, drillLeads:revertedLeads});
  }
  const maxRev = Math.max(...reversaoRows.map(r=>r.valor), 1);
  const RW=560, RH=200, RPAD=36;
  const rbw = (RW-RPAD*2)/Math.max(reversaoRows.length,1);
  const reversaoSvg = reversaoRows.map((r,i)=>{
    const h = (RH-RPAD*2) * (r.valor/maxRev);
    const x = RPAD + i*rbw + rbw*0.15;
    const bw2 = rbw*0.7;
    const y = RH-RPAD-h;
    const prevVal = i>0 ? reversaoRows[i-1].valor : null;
    const color = prevVal==null ? "var(--accent)" : (r.valor>prevVal ? "var(--good)" : (r.valor<prevVal ? "var(--bad)" : "var(--accent)"));
    return `<g class="dash-drill-bar" data-drill="reversao-${r.mk}" style="cursor:pointer;">
      <rect x="${RPAD + i*rbw}" y="${RPAD}" width="${rbw}" height="${RH-RPAD*2}" fill="transparent"></rect>
      <rect x="${x}" y="${y}" width="${bw2}" height="${h}" fill="${color}" rx="3"></rect>
      <text x="${x+bw2/2}" y="${RH-RPAD+16}" font-size="9" text-anchor="middle" fill="var(--ink-faint)">${fmtMonthKey(r.mk)}</text>
    </g>`;
  }).join("");
  let trendHtml = "";
  if(reversaoRows.length>=2){
    const last = reversaoRows[reversaoRows.length-1];
    const prevRow = reversaoRows[reversaoRows.length-2];
    const delta = last.valor - prevRow.valor;
    const deltaPct = prevRow.valor ? Math.round(delta/prevRow.valor*100) : (last.valor?100:0);
    const cls = delta>0?"trend-up":(delta<0?"trend-down":"trend-flat");
    const arrow = delta>0?"▲":(delta<0?"▼":"—");
    trendHtml = `<div class="sub-note"><span class="${cls}">${arrow} ${Math.abs(deltaPct)}%</span> em relação ao mês anterior (${fmtMonthKey(prevRow.mk)} → ${fmtMonthKey(last.mk)}) — ${fmtMoney(prevRow.valor)} → ${fmtMoney(last.valor)}</div>`;
  }
  const reversaoExportRows = reversaoRows.map(r=>({"Mês": fmtMonthKey(r.mk), "Valor revertido (R$)": r.valor}));
  const reversaoPanel = `
    <div class="panel dash-card">
      ${dashCardHeader("Evolução das reversões (R$)", "reversao")}
      <div class="sub-note">Valor em R$ de clientes recuperados/impedidos de inativar, mês a mês.</div>
      ${trendHtml}
      <svg viewBox="0 0 ${RW} ${RH}" style="width:100%; height:auto;">
        <line x1="${RPAD}" y1="${RH-RPAD}" x2="${RW-RPAD}" y2="${RH-RPAD}" stroke="var(--border)"></line>
        ${reversaoSvg}
      </svg>
    </div>`;

  const kpiExportRows = stageOrder.map(key=>{
    const stage = STAGES.find(s=>s.key===key);
    const c = stageCounts[key]||0;
    return {"Indicador": stage.label, "Total": c, "%": pct(c,total)};
  }).concat([
    {"Indicador":"Frios", "Total":tempCounts.frio, "%":pct(tempCounts.frio,total)},

/* ============================= AGENDA DE LIGAÇÕES ============================= */
// Visão separada, mas totalmente integrada ao pipeline: não tem base de dados
// própria (diferente do protótipo agendaligacoes.html) — os "compromissos" são
// os próprios leads do pipeline, lidos direto de dtUltimoContato/dtProximoContato,
// e usa os MESMOS filtros globais (filterbar/shortcuts/busca) já aplicados em
// currentFiltered(), então qualquer filtro do Pipeline também filtra a Agenda.
const AGENDA_WEEKDAY_NAMES = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function agendaStatusFor(dateStr, todayStr){
  if(dateStr < todayStr) return "atrasada";
  if(dateStr === todayStr) return "hoje";
  return "futuro";
}
function agendaDayLabel(dateStr){
  const d = parseISODate(dateStr);
  if(!d) return "";
  const label = AGENDA_WEEKDAY_NAMES[d.getDay()]+", "+d.getDate()+" de "+MONTH_NAMES[d.getMonth()];
  return label.charAt(0).toUpperCase()+label.slice(1);
}
function agendaShortDate(dateStr){
  const d = parseISODate(dateStr);
  if(!d) return "—";
  return d.getDate()+" "+MONTH_NAMES[d.getMonth()].slice(0,3);
}
function renderAgenda(){
  const wrap = document.getElementById("viewAgenda");
  const list = currentFiltered(); // respeita todos os filtros/atalhos/busca do Pipeline
  const todayStr = isoDateLocal(new Date());

  // Só entram na Agenda os leads com "próximo contato" agendado.
  const scheduled = list.filter(l=>l.dtProximoContato);
  const callsByDay = {};
  scheduled.forEach(l=>{ (callsByDay[l.dtProximoContato] = callsByDay[l.dtProximoContato] || []).push(l); });

  const todaysCalls = callsByDay[todayStr] || [];
  const overdue = scheduled.filter(l=>l.dtProximoContato < todayStr);

  /* ---- Rail: resumo de hoje + próximo contato + lista de próximos ---- */
  // Ordena por data e, dentro do mesmo dia, pelo horário do próximo contato
  // (leads sem horário registrado — base legada — vão para o fim do dia).
  const sortKey = l => l.dtProximoContato+"T"+(l.horaProximoContato||"99:99");
  const sortedUpcoming = scheduled.slice().sort((a,b)=> sortKey(a) < sortKey(b) ? -1 : (sortKey(a) > sortKey(b) ? 1 : 0));
  const nextCall = sortedUpcoming.find(l=>l.dtProximoContato >= todayStr) || null;
  const nextCallHtml = nextCall
    ? `<div class="agd-next-call" data-agd-open="${escapeHtml(nextCall.cod)}">
         <div class="lbl">Próximo contato</div>
         <div class="nm">${escapeHtml(nextCall.cli||"—")}</div>
         <div class="wh">${agendaShortDate(nextCall.dtProximoContato)}${nextCall.horaProximoContato?" às "+escapeHtml(nextCall.horaProximoContato):""}</div>
       </div>`
    : `<div class="agd-empty">Nenhum contato futuro agendado.</div>`;

  const upcomingItems = sortedUpcoming.slice(0, 10);
  const upcomingHtml = upcomingItems.length
    ? upcomingItems.map(l=>{
        const st = agendaStatusFor(l.dtProximoContato, todayStr);
        return `<div class="agd-upcoming-item${st==="atrasada"?" overdue":""}" data-agd-open="${escapeHtml(l.cod)}">
          <div class="dchip">${agendaShortDate(l.dtProximoContato)}${l.horaProximoContato?`<br>${escapeHtml(l.horaProximoContato)}`:""}</div>
          <div class="info">
            <div class="nm">${escapeHtml(l.cli||"—")}</div>
            <div class="mt">${escapeHtml(l.vendedor||l.time||"Sem responsável")}</div>
          </div>
        </div>`;
      }).join("")
    : `<div class="agd-empty">Nada agendado com os filtros atuais.</div>`;

  /* ---- Calendário mensal ---- */
  const firstOfMonth = new Date(state.agendaYear, state.agendaMonth, 1);
  const startWeekday = firstOfMonth.getDay();
  const gridStart = new Date(state.agendaYear, state.agendaMonth, 1-startWeekday);
  let calHtml = "";
  for(let i=0;i<42;i++){
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    const dStr = isoDateLocal(d);
    const inMonth = d.getMonth()===state.agendaMonth;
    const isToday = dStr===todayStr;
    const isSelected = dStr===state.agendaSelectedDate;
    const dayCalls = (callsByDay[dStr]||[]);
    const cls = ["agd-cal-cell"];
    if(!inMonth) cls.push("other-month");
    if(isToday) cls.push("today");
    if(isSelected) cls.push("selected");
    let chips = "";
    dayCalls.slice(0,3).forEach(l=>{
      chips += `<div class="agd-cal-chip ${agendaStatusFor(dStr, todayStr)}">${escapeHtml(l.cli||"—")}</div>`;
    });
    const more = dayCalls.length>3 ? `<div class="agd-cal-more">+${dayCalls.length-3} mais</div>` : "";
    calHtml += `<div class="${cls.join(" ")}" data-agd-date="${dStr}">
      <div class="agd-daynum">${d.getDate()}</div>
      <div class="agd-cal-chips">${chips}</div>${more}
    </div>`;
  }

  /* ---- Cronograma da semana: o dia de hoje fica sempre fixado/visível;
     o restante da semana pode ser ocultado/exibido pelo botão de alternância. ---- */
  const todaySched = scheduleForWeekday(new Date().getDay());
  const todayScheduleHtml = todaySched ? `
    <div class="agd-week-day is-today agd-week-day-pinned">
      <div class="agd-week-day-head"><span>${todaySched.icon}</span> ${todaySched.label} <span class="agd-week-pinned-tag">hoje · fixado</span></div>
      <ul>${todaySched.itens.map(it=>`<li>${escapeHtml(it)}</li>`).join("")}</ul>
      <div class="agd-week-obj">🎯 ${escapeHtml(todaySched.objetivo)}</div>
    </div>` : `<div class="agd-week-day agd-week-day-pinned"><div class="agd-week-day-head">Fim de semana</div><div class="agd-week-obj">Sem cronograma comercial fixo — bom descanso!</div></div>`;

  const weekPanelHtml = state.showWeekPanel ? `
    <div class="agd-week-panel">
      ${WEEKLY_SCHEDULE.map(d=>`
        <div class="agd-week-day${d.weekday===new Date().getDay()?" is-today":""}">
          <div class="agd-week-day-head"><span>${d.icon}</span> ${d.label}</div>
          <ul>${d.itens.map(it=>`<li>${escapeHtml(it)}</li>`).join("")}</ul>
          <div class="agd-week-obj">🎯 ${escapeHtml(d.objetivo)}</div>
        </div>`).join("")}
      <div class="agd-week-routine">
        ${ROTINA_DIARIA.map(r=>`<span class="chip">${escapeHtml(r)}</span>`).join("")}
      </div>
    </div>` : "";

  wrap.innerHTML = `
    <div class="agd-week-pinned-row">
      ${todayScheduleHtml}
      <div class="agd-week-toggle">
        <button type="button" class="btn btn-subtle" id="agdWeekToggleBtn">${state.showWeekPanel?"▲ Ocultar semana completa":"▼ Ver semana completa"}</button>
        <button type="button" class="btn btn-subtle" id="agdNotifBtn">${(typeof Notification!=="undefined" && Notification.permission==="granted") ? "🔔 Lembretes ativados" : "🔔 Ativar lembretes de ligação neste computador"}</button>
      </div>
    </div>
    ${weekPanelHtml}
    <div class="agd-layout">
      <aside>
        <div class="panel agd-panel">
          <h3 class="agd-h3">Hoje</h3>
          <div class="agd-today-count mono">${todaysCalls.length}</div>
          <div class="agd-today-cap">${todaysCalls.length===1?"contato agendado":"contatos agendados"}</div>
          ${overdue.length ? `<div class="agd-overdue-flag" data-agd-goto="${overdue[0].dtProximoContato}">⚠ ${overdue.length} contato(s) atrasado(s)</div>` : ""}
          ${nextCallHtml}
        </div>
        <div class="panel agd-panel">
          <h3 class="agd-h3">Próximos contatos</h3>
          <div class="agd-upcoming-list">${upcomingHtml}</div>
        </div>
      </aside>
      <main>
        <div class="panel agd-cal-card">
          <div class="agd-cal-head">
            <div class="agd-nav-btns">
              <button type="button" data-agd-nav="prev" aria-label="Mês anterior">‹</button>
              <button type="button" class="agd-today-btn" data-agd-nav="today">Hoje</button>
              <button type="button" data-agd-nav="next" aria-label="Próximo mês">›</button>
            </div>
            <div class="agd-month-label">${MONTH_NAMES[state.agendaMonth]} de ${state.agendaYear}</div>
          </div>
          <div class="agd-cal-weekdays"><div>dom</div><div>seg</div><div>ter</div><div>qua</div><div>qui</div><div>sex</div><div>sáb</div></div>
          <div class="agd-cal-grid">${calHtml}</div>
        </div>
      </main>
    </div>`;

  function agendaGoto(dateStr){
    const d = parseISODate(dateStr);
    if(!d) return;
    state.agendaYear = d.getFullYear();
    state.agendaMonth = d.getMonth();
    state.agendaSelectedDate = dateStr;
    renderAgenda();
  }

  wrap.querySelectorAll("[data-agd-goto]").forEach(el=>{
    el.addEventListener("click", ()=> agendaGoto(el.dataset.agdGoto));
  });
  wrap.querySelectorAll("[data-agd-date]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.agendaSelectedDate = el.dataset.agdDate;
      renderAgenda();
    });
  });
  wrap.querySelectorAll("[data-agd-open]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      openContactPopup(el.dataset.agdOpen);
    });
  });
  const weekToggleBtn = wrap.querySelector("#agdWeekToggleBtn");
  if(weekToggleBtn) weekToggleBtn.addEventListener("click", ()=>{
    state.showWeekPanel = !state.showWeekPanel;
    renderAgenda();
  });
  const notifBtn = wrap.querySelector("#agdNotifBtn");
  if(notifBtn) notifBtn.addEventListener("click", requestNotificationPermission);
  const navPrev = wrap.querySelector('[data-agd-nav="prev"]');
  const navNext = wrap.querySelector('[data-agd-nav="next"]');
  const navToday = wrap.querySelector('[data-agd-nav="today"]');
  if(navPrev) navPrev.addEventListener("click", ()=>{
    state.agendaMonth--; if(state.agendaMonth<0){ state.agendaMonth=11; state.agendaYear--; }
    renderAgenda();
  });
  if(navNext) navNext.addEventListener("click", ()=>{
    state.agendaMonth++; if(state.agendaMonth>11){ state.agendaMonth=0; state.agendaYear++; }
    renderAgenda();
  });
  if(navToday) navToday.addEventListener("click", ()=>{
    const t = new Date();
    state.agendaYear = t.getFullYear(); state.agendaMonth = t.getMonth(); state.agendaSelectedDate = isoDateLocal(t);
    renderAgenda();
  });
}


/* ============================= RENDER: KANBAN ============================= */
function renderBoard(){
  const board = document.getElementById("board");
  const list = currentFiltered();
  board.innerHTML = "";
  STAGES.forEach(stage=>{
    const items = list.filter(l=>l.stage===stage.key);
    const col = document.createElement("div");
    col.className = "col";
    col.dataset.stage = stage.key;
    const totalVal = items.reduce((s,l)=>s+(Number(l.fatCom)||0),0);
    col.innerHTML = `
      <div class="col-head"><span class="dot" style="background:${stage.color}"></span><b ${stage.hint?`title="${escapeHtml(stage.hint)}"`:""}>${stage.label}</b><button type="button" class="col-search-btn" data-stage-search="${stage.key}" title="Pesquisar/selecionar em massa por Cód Cliente">🔎</button><span class="count">${items.length}</span></div>
      <div class="col-body" data-stage="${stage.key}"></div>
      <div class="col-sum">Fat. comercial: ${fmtMoney(totalVal)}</div>
    `;
    col.querySelector(".col-search-btn").addEventListener("click", (e)=>{
      e.stopPropagation();
      openBulkSearchPopover(e.currentTarget, stage.key);
    });
    const body = col.querySelector(".col-body");
    if(!items.length){
      body.innerHTML = `<div class="empty-col">Nenhum lead</div>`;
    }else{
      items.sort((a,b)=>{
        const da = daysUntil(a.dtInat); const db = daysUntil(b.dtInat);
        return (da==null?9999:da) - (db==null?9999:db);
      });
      items.forEach(l=> body.appendChild(renderCard(l)));
    }
    attachDnD(body, col);
    board.appendChild(col);
  });
}

function renderCard(l){
  const card = document.createElement("div");
  card.className = "card" + ((state.bulkSelected && state.bulkSelected.has(l.cod)) ? " bulk-selected" : "");
  card.draggable = true;
  card.dataset.cod = l.cod;
  const temp = temperature(l);
  const d = daysUntil(l.dtInat);
  let daysLabel = "—";
  if(d!=null){
    if(d<0) daysLabel = `<span class="card-days overdue">${l.stage==="inativo"?`Inativado há ${Math.abs(d)}d`:`Inativou há ${Math.abs(d)}d`}</span>`;
    else if(d===0) daysLabel = `<span class="card-days overdue">Inativa hoje</span>`;
    else daysLabel = `<span class="card-days">Inativa em ${d}d</span>`;
  }
  card.innerHTML = `
    <div class="card-top">
      <div class="card-name">${escapeHtml(l.cli||"—")}</div>
      ${temp ? `<span class="temp-dot" title="${TEMP_LABEL[temp]}" style="background:${TEMP_COLOR[temp]}"></span>` : ""}
    </div>
    <div class="card-meta">
      <span class="chip">${escapeHtml(l.cod)}</span>
      <span class="chip">${escapeHtml(l.uf||"—")}</span>
      <span class="chip status-${l.status}">${STATUS_LABEL[l.status]}</span>
    </div>
    <div class="card-meta">
      <span>${fmtMoney(l.fatCom)}</span>
      ${daysLabel}
    </div>
    <div class="card-foot">
      <span>${escapeHtml(l.vendedor || l.time || "Sem responsável")}</span>
      ${isStale(l) ? '<span class="stale">Sem atualização 7d+</span>' : `<span>${fmtDate(l.dtInat)}</span>`}
    </div>
  `;
  card.addEventListener("click", ()=> openLeadModal(l.cod));
  card.addEventListener("dragstart", (e)=>{
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", l.cod);
    e.dataTransfer.effectAllowed = "move";
  });
  card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
  return card;
}

function attachDnD(body, col){
  body.addEventListener("dragover", (e)=>{ e.preventDefault(); col.classList.add("drop-hover"); });
  body.addEventListener("dragleave", ()=> col.classList.remove("drop-hover"));
  body.addEventListener("drop", (e)=>{
    e.preventDefault();
    col.classList.remove("drop-hover");
    const cod = e.dataTransfer.getData("text/plain");
    const newStage = col.dataset.stage;
    const lead = state.leads.find(l=>l.cod===cod);
    requestStageChange(lead, newStage);
  });
}

/* ============================= PERSIST SINGLE LEAD ============================= */
async function persistLead(lead){
  try{
    const meta = state.meta;
    if(!meta) return;
    const ci = meta.codToChunk[lead.cod];
    if(ci==null) return;
    const chunk = await Store.getChunk(state.monthKey, ci);
    const idx = (chunk.leads||[]).findIndex(x=>x.cod===lead.cod);
    if(idx>=0) chunk.leads[idx] = lead; else chunk.leads.push(lead);
    await Store.setChunk(state.monthKey, ci, chunk);
  }catch(err){
    console.error(err);
    toast("Não foi possível salvar a alteração agora. Tente novamente.", "err");
  }
}
